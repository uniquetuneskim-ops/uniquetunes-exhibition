<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>유니크튠즈 폐업기념 온라인 음악전시</title>
<meta name="description" content="유니크튠즈레코드 12년, 폐업기념 온라인 음악전시. 무료 관람.">
<meta property="og:type" content="website">
<meta property="og:title" content="유니크튠즈 폐업기념 온라인 음악전시">
<meta property="og:description" content="유니크튠즈레코드 12년, 무료 관람">
<meta property="og:url" content="https://uniquetuneskim-ops.github.io/uniquetunes-exhibition/">
<meta property="og:image" content="https://uniquetuneskim-ops.github.io/uniquetunes-exhibition/media/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a09; --bg2:#17110f; --ink:#f1e9df; --dim:#a89a8c; --faint:#62574d;
  --amber:#f3c26b; --amber2:#ffdf9e; --red:#7d1824; --red2:#a62233; --line:rgba(241,233,223,.12);
  --serif:"Gowun Batang",serif; --sans:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber)}
.btn{background:var(--amber);color:#1b120c;font-weight:600;padding:13px 22px;border-radius:8px;transition:background .15s,transform .15s;white-space:nowrap}
.btn:hover{background:var(--amber2);transform:translateY(-1px)}
.btn:disabled{opacity:.4;transform:none;cursor:default}

/* ---------- world ---------- */
#world{position:fixed;inset:0;display:block;touch-action:none;cursor:pointer}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:auto;padding:24px;
  background:radial-gradient(ellipse at 50% 0%,rgba(243,194,107,.18),transparent 60%),var(--bg)}
.gate-inner{text-align:center;max-width:520px;width:100%;-webkit-user-select:text;user-select:text}
.gate-logo{width:min(320px,70%);display:block;margin:0 auto 18px;opacity:.95}
.gate-inner h1{white-space:pre-line;font-family:var(--serif);font-size:clamp(34px,6vw,54px);line-height:1.2;margin:14px 0 8px}
.gate-inner .lead{color:var(--dim);margin-bottom:30px}
.ticket{position:relative;display:flex;text-align:left;background:linear-gradient(135deg,#f6ead4,#e9d6b4);color:#2a1d15;
  border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);margin:0 auto 24px;max-width:480px}
.ticket .main{flex:1;padding:20px 22px;border-right:2px dashed rgba(42,29,21,.35)}
.ticket .stub{width:112px;padding:20px 12px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.t-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;opacity:.6;text-transform:uppercase}
.t-title{white-space:pre-line;font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.25;margin:4px 0 12px}
.t-row{display:flex;gap:20px;flex-wrap:wrap}
.t-val{font-family:var(--mono);font-size:14px;font-weight:500}
.t-price{font-family:var(--serif);font-size:28px;font-weight:700}
.ticket:before,.ticket:after{content:"";position:absolute;right:102px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.ticket:before{top:-10px}.ticket:after{bottom:-10px}
.barcode{height:34px;width:80px;background:repeating-linear-gradient(90deg,#2a1d15 0 2px,transparent 2px 4px,#2a1d15 4px 5px,transparent 5px 8px)}
.ticket.print{animation:print 1s cubic-bezier(.2,.8,.2,1)}
@keyframes print{from{transform:translateY(40px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.gate-form{display:flex;flex-direction:column;gap:14px;max-width:480px;margin:0 auto}
.gate-form input{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--ink);font:inherit;font-size:16px}
.gate-form input:focus{outline:none;border-color:var(--amber)}
.colors{display:flex;gap:10px;justify-content:center;align-items:center}
.colors span{font-size:13px;color:var(--dim);margin-right:4px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;transition:transform .15s}
.sw.on{border-color:var(--ink);transform:scale(1.15)}
.gate-note{font-size:13px;color:var(--faint);margin-top:14px}

/* ---------- curtain ---------- */
.curtain{position:fixed;top:0;bottom:0;width:51%;z-index:55;pointer-events:none;
  background:repeating-linear-gradient(90deg,#5c0f18 0 22px,#8a1a27 22px 40px,#6b121d 40px 60px);
  box-shadow:inset 0 -60px 120px rgba(0,0,0,.6);transition:transform 2.2s cubic-bezier(.7,0,.2,1)}
.curtain.l{left:0}.curtain.r{right:0}
body.open .curtain.l{transform:translateX(-102%)}
body.open .curtain.r{transform:translateX(102%)}

/* ---------- HUD ---------- */
.hud-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 16px;pointer-events:none;
  background:linear-gradient(rgba(13,10,9,.85),rgba(13,10,9,0))}
.hud-top>*{pointer-events:auto}
.brand{font-family:var(--serif);font-weight:700;font-size:16px;white-space:nowrap}
.brand b{color:var(--amber)}
.roomname{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--dim);border-left:1px solid var(--line);padding-left:14px;white-space:nowrap}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#e2483d;box-shadow:0 0 10px #e2483d;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
#minimap{position:fixed;top:52px;right:16px;z-index:20;background:rgba(13,10,9,.75);border:1px solid var(--line);border-radius:8px;cursor:pointer}

.hud-bot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px;pointer-events:none}
.hud-bot>*{pointer-events:auto}
.music{display:flex;align-items:center;gap:10px;background:rgba(23,17,15,.9);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;max-width:320px}
.music .pb{width:34px;height:34px;border-radius:50%;background:var(--amber);color:#1b120c;display:grid;place-items:center;flex:none}
.music .pb:disabled{opacity:.4}
.music .meta{min-width:0;line-height:1.3}
.music .tt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .ta{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .nx{color:var(--dim);flex:none}
.emotes{display:flex;gap:6px;background:rgba(23,17,15,.9);border:1px solid var(--line);border-radius:999px;padding:5px}
.emotes button{width:38px;height:38px;border-radius:50%;font-size:19px;transition:transform .1s}
.emotes button:hover{background:rgba(255,255,255,.06);transform:scale(1.12)}
.help{font-size:12px;color:var(--faint);text-align:right;line-height:1.5}
.prompt{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:21;background:var(--amber);color:#1b120c;font-weight:600;
  padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap;animation:pop .2s}
@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}
.prompt.up{top:64px;bottom:auto}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,4,3,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:min(1100px,100%);max-height:calc(100vh - 40px);
  display:grid;grid-template-columns:1.55fr 1fr;overflow:hidden;-webkit-user-select:text;user-select:text}
.panel.single{grid-template-columns:1fr;width:min(760px,100%)}
.close{position:absolute;top:10px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);font-size:18px;color:var(--dim)}
.close:hover{color:var(--ink)}
.screen{background:#000;display:flex;flex-direction:column;justify-content:center;min-height:300px;max-height:calc(100vh - 40px);position:relative}
.screen iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.screen video,.screen img{width:100%;max-height:calc(100vh - 40px);object-fit:contain;display:block}
.screen .noscreen{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;color:var(--faint);font-family:var(--mono);font-size:12px;letter-spacing:.12em;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 14px,transparent 14px 28px),#0f0b0a}
.side{padding:26px 24px 20px;display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 40px);overflow:auto}
.side .desc{flex:none}
.side h2{font-family:var(--serif);font-size:26px;line-height:1.3;margin:6px 0 10px}
.side .desc{color:var(--dim);font-size:15px;white-space:pre-wrap}
.side .desc.ph{color:var(--faint);font-style:italic}
.host{margin:14px 0 18px;padding:14px 16px;border-left:3px solid var(--red2);background:rgba(166,34,51,.08);border-radius:0 8px 8px 0}
.host-who{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#e07a85;margin-bottom:8px}
.host-pic{width:40px;height:44px;flex:none}
.host-tx{font-family:var(--serif);font-size:15.5px;line-height:1.8;white-space:pre-wrap}
.watching{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:14px}
.cm-head{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--faint);margin:22px 0 10px;border-top:1px solid var(--line);padding-top:18px}
.cms{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.cm{font-size:14px;line-height:1.6;position:relative;padding-left:14px;border-left:2px solid var(--line)}
.cm.mine{border-left-color:var(--amber)}
.cm .who{font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center}
.cm .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.cm .tx{white-space:pre-wrap;word-break:break-word}
.cm .del{font-size:11px;color:var(--faint);margin-left:auto}
.cm .del:hover{color:var(--red2)}
.cm-empty{font-size:13px;color:var(--faint)}
.cm-form{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.cm-form textarea{width:100%;min-height:72px;resize:vertical;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;font-size:15px}
.cm-form textarea:focus{outline:none;border-color:var(--amber)}
.cm-form .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cm-form .note{font-size:12px;color:var(--faint)}
.cm-form .btn{padding:9px 18px}

/* story (글+이미지) */
.panel.story{grid-template-columns:1.15fr 1fr;height:calc(100vh - 40px);grid-template-rows:minmax(0,1fr)}
.panel.story .side{min-height:0}
.panel.story .screen{position:relative;min-height:0;height:100%;background:#0c0908;display:block}
.st-img{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .9s ease}
.st-img.on{opacity:1}
.st-img img{width:100%;height:100%;object-fit:contain}
.st-img .noscreen{width:100%;height:100%}
.st-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:8px;justify-content:center}
.st-dots span{width:7px;height:7px;border-radius:50%;background:rgba(241,233,223,.3);transition:background .4s}
.st-dots span.on{background:var(--amber)}
.st-text{margin-top:18px}
.st-p{font-family:var(--serif);font-size:16.5px;line-height:1.95;margin-bottom:1.1em;color:var(--ink);white-space:pre-wrap}
.st-h{font-family:var(--serif);font-size:20px;line-height:1.5;margin:1.8em 0 .8em;color:var(--amber2)}
.st-link{display:inline-block;margin:6px 0 10px;font-size:13px;color:var(--amber)}
.st-mark{height:1px;margin:1.6em 0;background:linear-gradient(90deg,transparent,rgba(243,194,107,.5),transparent)}
.st-inline{display:none}
@media (max-width:800px){ .panel.story{grid-template-rows:auto;display:block;overflow:auto;height:calc(100vh - 40px)} .panel.story .screen{display:none} .panel.story .side{overflow:visible;padding-top:30px} .st-mark{height:auto;background:none;margin:1.2em 0} .st-inline{display:block;width:100%;border-radius:8px} }

/* guestbook board */
.gb{padding:34px 30px 26px;overflow:auto;max-height:calc(100vh - 40px)}
.gb h2{font-family:var(--serif);font-size:30px;margin:8px 0 6px}
.gb .sub{color:var(--dim);font-size:14px;margin-bottom:22px}
.cards{columns:2 240px;column-gap:16px;margin-top:22px}
.card{break-inside:avoid;margin-bottom:16px;background:linear-gradient(160deg,#f4e7cf,#e6d1ad);color:#2a1d15;border-radius:8px;padding:18px 18px 14px;position:relative;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.card:nth-child(3n+2){transform:rotate(.6deg)}.card:nth-child(3n){transform:rotate(-.5deg)}
.card .msg{font-family:var(--serif);font-size:15.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.card .meta{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:8px;border-top:1px dashed rgba(42,29,21,.3);font-family:var(--mono);font-size:11px;color:rgba(42,29,21,.65)}
.card .meta b{color:#2a1d15;font-weight:500}
.card.mine{outline:2px solid var(--amber);outline-offset:3px}
.card .del{position:absolute;top:6px;right:10px;font-size:11px;color:rgba(42,29,21,.5)}

/* letter */
.letter{padding:56px 40px 48px;text-align:center;overflow:auto;max-height:calc(100vh - 40px);background:radial-gradient(ellipse at 50% 100%,rgba(166,34,51,.25),transparent 60%)}
.letter h2{font-family:var(--serif);font-size:clamp(30px,5vw,46px);margin:14px 0 24px}
.letter .body{color:var(--dim);font-family:var(--serif);font-size:17px;line-height:2;white-space:pre-wrap}
.letter .sign{margin-top:24px;font-family:var(--serif)}
.letter .credits{margin-top:44px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--faint);line-height:2.2}
.letter .credits b{color:var(--dim);font-weight:400}

@media (max-width:800px){
  .panel{grid-template-columns:1fr;overflow:auto}
  .side{overflow:visible}
  .help,.roomname{display:none}
  .music{max-width:180px}
  .emotes button{width:32px;height:32px;font-size:16px}
  .hud-bot{padding:10px}
  .ticket .stub{width:92px}.ticket:before,.ticket:after{right:82px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

        text:"나는 2014년부터 12년 동안 음악 레이블 유니크튠즈를 운영했다. 문을 닫기로 마음먹고, 이메일 계정과 사진 아카이브를 열어 그 시간을 하나씩 꺼내 보았다.\n\n이 회고록은 그 기록이다. 함께 음악을 만든 사람들과, 그때 우리가 시도했던 것들에 대한.\n\n## 01. 첫 시작: LODIA\n\n2014년, 유니크튠즈를 시작하며 처음부터 그린 그림은 ‘한국 인디 레이블’이 아니라 글로벌 인디펜던트 레이블이었다. 모토는 most unique music in the world.\n\n애초에 해외에서 통할 팀을 만들고, 세계 시장의 문을 두드린다는 목표로 설계를 시작했다. 로디아(LODIA)는 그 목적을 위해 만든 첫 번째 팀이었다.\n\n## 1) 작은 시작\n\n시작 당시의 판돈은 어머니가 ‘향후 결혼 자금’으로 평생 모아두셨던 청약 통장을 해지한 돈이었다.\n\n[이미지1]\n\n그 돈으로 서울 강남구 역삼동, 외진 골목의 지하 작업실을 얻었다.\n\n[이미지2]\n\n당시의 레이블 운영 계획 메모\n\n[이미지3]\n\n아래 3번째 Hays Code 가 LODIA 의 초기 기획때의 이름이었다.\n\n자본은 비어 있었지만, 응원은 식탁 위에 있었다.\n\n[이미지4]\n\n## 2) 기획: 씬을 좁히고, 칼날을 세우다\n\n당시 나는 캘빈 해리스(Calvin Harris), 아이코나 팝(Icona Pop), 크루웰라(Krewella) 같은 팝적인 EDM을 한국에서 먼저 시도하고 글로벌 K-POP 팬들에게 어필하고 싶었다. 메인스트림의 아이돌 문법을 비켜서, Icona Pop / Nervo 같은 파워풀한 여성 일렉트로닉 듀오의 감각을 레퍼런스로 삼았다.\n\n그리고 그 문법을 한국과 K-POP 시장에 맞게 다시 설계했다.\n\n아래는 실제로는 안 쓰인 로디아 로고.\n\n[이미지5]\n\n[이미지6]\n\n(유니크튠즈의 첫 작업실). 멤버 하영의 뒷모습\n\n## 3) 콘텐츠 퀄리티: ‘일단 잘 만들자’\n\n멤버 수란의 자작곡 데모를 프랑스 파리로 보내 편곡 작업을 먼저 시작해두고, 나도 직접 파리로 건너가 현지에서 편곡 작업을 함께 했다.\n\n당시 한국에는 ‘한국말로 부르는 EDM Pop’ 레퍼런스 자체가 거의 없다고 느꼈고, 원하는 퀄리티를 만들려면 현지 프로듀서들과 직접 부딪히며 작업해야 한다고 생각했다. 물론 출발점이 된 수란의 원곡 데모가 좋았던 것도 컸다.\n\nCalvin Harris, David Guetta, Icona Pop 같은 트렌디한 EDM Pop만큼의 사운드를 내기 위해, 나와 Ray PD, 멤버들 모두 정말 노력했다.\n\n그 결과 타이틀곡 ‘I Got A Feeling (TASTIX Remix)’이 나왔다. 마스터링은 데이비드 게타(David Guetta)의 전임 마스터링 엔지니어였던 프랑스의 David Hachour가 맡았다.\n\n[이미지7]\n\n자켓 이미지에 등장하는 종이 총과 종이 야구 배트는 손재주가 좋은 대학교 동기에게 부탁해 만들었다. 음악을 ‘일단’ 듣게 만들려면, 시각적으로 한 번은 눈길을 끌어야 한다고 생각했다.\n\n자켓 촬영은 지인 포토그래퍼가 맡아 주었다.\n\n## 4) 데뷔 전 마케팅: 글로벌 ‘타겟 광고’\n\n2014년 당시 국내 엔터 업계에서는 생소했던 ‘페이스북 광고 픽셀(Pixel)’을 심어, 글로벌 EDM 유저와 장르 마니아층에게 로디아를 소개했다.\n\n[이미지8]\n\n페이스북에서 참여형 마케팅을 돌렸다. 댓글이 많을수록 타겟이 잘 잡혔다는 신호였다.\n\n그 결과 해외 바이럴 40만 뷰를 기록했고, 유튜브 댓글 창에서 “Icona K-POP”이라는 피드백을 받았다. 기획 의도와 정확히 맞는 반응이었다. 모바일 트래픽의 중심이었던 스낵 미디어 \"피키캐스트(Pikicast)\"에도 소개됐다.\n\n[이미지9]\n\n타이포 그래피와 사진을 이용한 티저 영상은, 창업전 잠시 다니던 마케팅 회사에서 만난 선배가 만들어 주셨다.\n\n## 5) 2014년 7월 9일\n\n당시엔 멜론에 ‘추천곡’ 같은 영역이 있었고, 멜론 메인이 실제로 효과가 있던 시기였다.\n\n발매 3~4개월 전부터 페이스북 마케팅을 집중해 “데뷔도 전인데 해외 반응이 좋다”는 신호를 만들었다. 그 데이터를 근거로 유통사에 제안했고, 멜론 메인 노출과 추천곡을 따냈다. 그리고 2014년 7월 9일 정오, 음원이 발매됐다.\n\n[이미지10]\n\n그날 엠넷 메인 추천곡 진입과 멜론 메인 페이지 노출이 함께 확보됐다.\n\n발매 후 며칠 뒤 장르 차트에 진입했고, 최종 성적은 32위까지 갔던 것으로 기억한다.\n\n[이미지11]\n\n우리 팀 아래 라인업에는 캘빈 해리스(Calvin Harris)의 ‘Summer’가, 그 아래에는 아민 반 뷰렌(Armin Van Buuren)의 ‘Ping Pong’이 있었다. 위아래에 세계적인 아티스트가 있으니, 왠지 내 기획이 통한 것 같은 기분이 들었다.\n\n역삼동 지하 작업실은 비만 오면 바닥에서 물이 차오르는 곳이었다. 모니터 속에서는 우리 노래가 차트에 올라 있었고, 그날 밤 우리는 걸레와 바가지로 작업실을 지켰다.\n\n[이미지12]\n\n## 6) ‘우리가 요청한 게 아닌’ 인바운드: 보그걸 메시지 한 장\n\n여러 매체에서도 연락이 오기 시작했다. 우리가 비용을 들여 지면을 요청한 것이 아니었다.\n\n패션 매거진 <보그걸(Vogue Girl)> 측에서 내 DM으로 먼저 협업 및 화보 인터뷰 제안을 보내왔다. 며칠 뒤, 우리는 촬영 스튜디오 한복판에 서 있었다.\n\n의상은 멤버들이 직접 골랐다.\n\n[이미지13]\n\n[이미지14]\n\n## 7) ‘한국이 좁으면, 세계로’\n\n로디아를 하며 국내 장르 시장이 생각보다 좁다는 걸 알게 됐다. 그래서 더 넓은 무대를 바라보기로 했다.\n\n글로벌 인디 피칭 플랫폼 ‘Sonicbids’를 통해, 지금은 사라진 뉴욕 ‘CMJ 뮤직 마라톤’, ‘Indie Week Canada’, SXSW 등을 비롯한 전 세계 쇼케이스와 페스티벌에 제안서를 보냈다. 글로벌의 관문은 좁았다.\n\n(나는 이 글의 다음 편에서 결국 Indie Week Canada에 가는 이야기를 할 예정이다.)\n\n(아래는 대표적인 거절 이메일)\n\n[이미지15]\n\n## 8) 다음으로\n\n로디아는 유니크튠즈가 처음으로 세상에 내놓은 팀이었다. 처음부터 세계를 향해 두드린다는 방향은 이 팀에서 시작됐고, 그 마음은 고스란히 다음 프로젝트로 이어진다.\n\n다음 편, 밴드 트리스(TRISS)." }   // 글 본문. 빈 줄로 문단 구분, [이미지2] 라고 적은 줄부터 두 번째 이미지로 바뀜

      { id:"w05b", year:"2016", title:"DAZE · 1st EP 프리뷰", desc:"DAZE 1st EP Album Preview\n\nChill-out R&B 프로듀서 'DAZE(데이즈)'\n\n프로듀서형 뮤지션 'DAZE(데이즈)'는 작사, 작곡은 물론이고 편곡, 연주, 프로그래밍, 믹싱, 마스터링 등 음악 전체의 프로듀싱까지 직접 하는 아티스트이다.\n\n24살의 이 젊은 프로듀서가 Chill-out & Future R&B로 가득 채운 그의 첫 번째 EP [Young Love]로, K-POP 팬들에게 새로운 음악적 즐거움을 선사할 것이다. 또한 그의 SNS에서 'WE LOVE Chill-out R&B' 방송을 통해 'DAZE'의 신곡 작업과정을 공개한다.\n\n\"조금은 가벼워도, 지금은 괜찮아.\"\n\n[Young Love]는 프로듀서 뮤지션 'DAZE(데이즈)'가 자신과 같은 20대의 청춘들이 공감할 수 있는 사랑에 관해 이야기한 앨범이다. '술과 음악이라는 매개체로 맺어지는 인연들. 빠르고 자유분방한, 그래서 때론 순간처럼 스쳐 지나는 가벼운 만남은 어쩌면 20대가 누릴 수 있는 자유의 단편이라 생각한다'고 말하는 그는 그런 생각을 앨범 전체에 녹여내어 하나의 스토리텔링을 완성한다.\n\n이 앨범은 한 남자의 시점에서 이야기가 진행된다. 잔잔하고 끈적한 느낌의 음악이 흐르는 클럽 안의 한 여자, 그곳에서 짧은 순간이지만 그녀에 대해 알아가며 사랑에 빠져버린 남자. 두 사람은 연인이 돼 연애를 하지만 그 시작이 가벼웠듯 참을 수 없는 가벼운 사랑에 결국 멀어지고, 남자는 그녀를 떠나 보낸 후에야 자신의 사랑이 자신도 모르는 사이 깊어졌음을 깨닫는다. 그러나 결국 남은 것은 후회뿐. 그녀를 만나던 금요일이면 습관처럼 그녀를 그리워하는 남자의 이야기를 담고 있다.\n\n[Credit]\nProduced by DAZE\nComposed by DAZE\nLyrics by DAZE\nArranged by DAZE\nVocal by DAZE\nChorus by DAZE\nMixed by DAZE\nMastered by DAZE\n(except Track 03. Only U Mastered by 박경선 at Boost Knob)\n\n[Staff]\nExecutive Produced by 김형민 at UniqueTunes Records\nSupervised by Ray Hill\nA&R by 김태진\nStrategy Planning by 김형민\nMarketing by Euph Kim\nArtwork by STUDIO ONSIL\nVisual Design by KiKi\nDistribution, Promotion by CJ E&M MUSIC\nSpecial Thanks to 길현철, 윤지영, 윤지혜, 조인옥, 노준영(디즈컬), 박승환, 이가은, 큐오뮤직\nUniqueTunes Records : 김형민, Ray Hill, Alphamus, 길민우, 김태진, 김민희, 배은경, Fatal, Kimoxavi, 이소영 and DAZE.", say:"", note:"DAZE 첫 미니앨범이에요. 프로듀싱, 작사작곡편곡, 믹싱마스터링까지 DAZE 가 다 했고, Chill 한 r&b 를 컨셉으로 잡았어요.\n2016년 12월 6일에 나왔고, Friday가 처음 실린 앨범이에요.", youtube:"", video:"media/w05b.mp4", image:"media/w05b.jpg" },
      { id:"w05c", year:"2017", title:"DAZE · 2nd EP 프리뷰", desc:"DAZE 2nd EP 'Friday' Album Preview\n\nChill-out R&B Producer 'DAZE (데이즈)'의 두 번째 EP [Friday]\n\n'DAZE'의 두 번째 미니앨범 [Friday]는 전작 [Young Love]와 마찬가지로 Chill-out R&B 장르를 기반으로 'DAZE'가 작사, 작곡, 편곡과 연주, 프로그래밍, 믹싱 등 앨범 전체의 프로듀싱을 직접 한 앨범이다. 전작이 실험적이고 화려한 느낌의 앨범이었다면 이번 앨범에서는 화려함 대신 힘을 빼고 차분한 무드의 곡들로 앨범을 구성해 보다 깊어진 감성을 느낄 수 있다. 그렇지만 이번 앨범에서도 다양한 시도를 한 흔적을 찾아볼 수 있는데 4번 트랙 \"Take It Slow\"의 경우 본인이 직접 노래하는 대신 R&B 싱어 'Taylor'의 보컬을 차용하는가 하면 5번 트랙 \"너도\"의 경우는 전 앨범의 타이틀과 수록곡인 \"Young Love\"와 \"Only U\"와는 정반대의 미니멀한 편곡을 추구하여 피아노 반주 하나로 곡의 무드를 이끄는 등의 시도를 했다. 또한 'DAZE'가 지향하는 Chill한 감성을 시각적으로도 전달하기 위해 영국에서 현지 스태프들과 함께 뮤직비디오 촬영을 진행했다.\n\n- Music Credit\nProduced by DAZE\nComposed by DAZE (except Track 04 additional composed by Taylor)\nLyrics by DAZE (except Track 04 Lyrics by Taylor)\nArranged by DAZE (except Track 05 Piano Arranged by 계린)\nVocal by DAZE\nChorus by DAZE\nMixed by DAZE\nMastered by 전훈 @ Sonic Korea (except Track 03 Mastered by DAZE)\n\n[Staff]\nExecutive Produced by 김형민 @ UniqueTunes Records\nSupervised by Ray Hill\nA&R by Euph Kim\nMarketing by 강지은\nArtwork by XIU @ www.instagram.com/official.xiu\nPhotographer 황필주 @ www.piljoo.com\nHair & Make-Up Artist 이영란 @ RUE710\nDistribution, Promotion by CJ E&M MUSIC 윤지혜, 김호정\nSpecial Thanks to : 길현철, 노준영 @ www.dizcul.co.kr , 큐오뮤직, Maisie Duff, 전훈, 송현정, Taylor,헤일, 고호성\nUniqueTunes Records : 김형민, Ray Hill, Alphamus, 길민우, 김태진, Fatal, Kimoxavi, 강지은, Effy김하영 and DAZE @ www.uniquetunes.net\n\nWe are Unique.", say:"", note:"Friday는 1집 수록곡이었는데, 2집에서는 타이틀곡이 됐어요.", youtube:"", video:"media/w05c.mp4", image:"media/w05c.jpg" },
      { id:"w05", year:"2017", title:"DAZE · Friday", desc:"데이즈 (DAZE) - Friday (Director's Cut) MV\n\n- Music Video Credit\nDirector : Maisie Duff at SPRY Productions\nD.O.P : Michael East at SPRY Productions\nLighting : Sophia Tang\nHair and makeup : Harleigh Slaughter\nActress : Amy Cotter\nVideo effect : Michael East at SPRY Productions, Brian East\nAdditional video edit: 이준의 @ 왓츠더웨더, 김민희\nSpecial Thanks in UK : Davide Cirillo at Toni & Guy Hammersmith, Sophia Tang, Kimoxavi, Freya bigg @ www.UnitedKpop.com", say:"", note:"따로 예산이 없어서 뮤비를 안찍으려다가, 영국의 신진 감독님이 제안을 주셔서 런던에 가서 저예산뮤직비디오를 찍었어요", youtube:"", video:"media/w05.mp4", image:"media/w05.jpg" },

        text:"2016년 2월, 법인 자금을 받기 위해 사업소개서를 썼다. 제목은 \"가상현실 영상기술을 활용한 글로벌 음악수출 기업\"이었다.\n\n[이미지1]\n\n그때 나는 가상현실이 음악을 듣는 방식을 바꿀 거라고 믿었다. 초대형 페스티벌에서 내가 세계적인 DJ가 되어 무대에 서 보는 1인칭 음악, 뮤지션들이 나를 둘러싸고 연주하는 360도 음악.\n\n[이미지2]\n\n그런 음악과 영상을 영어, 불어로 만들어 전 세계에 수출하겠다는 계획이었다. 프랑스 프로듀서 팀 TASTIX와의 계약, 녹음실과 연습실을 활용한 콘텐츠 제작, 1인 음악창작자 커뮤니티 큐오넷의 유통·마케팅 대행까지. 소개서에는 그해 할 일이 빼곡하게 적혀 있었다.\n\n[이미지3]\n\n## 자금 계획\n\n자본금 계획은 세 갈래였다. 대표이사 개인 투자, 외주 홍보 매출, 그리고 중소기업청 청년전용 창업자금.\n\n[이미지4]\n\n지출 계획에는 VR 영상 장비와 제작비, 음악 녹음 장비, 뮤지션 계약금, 운영비와 인건비, 마케팅비가 들어갔다.\n\n[이미지5]\n\n월별 계획표에는 360도 가상현실 영상, 드론 항공촬영 영상, 기어VR용 음악영상의 출시 일정이 달마다 들어가 있었다.\n\n[이미지6]\n\n## 첫 법인 자금\n\n결과적으로 법인이 받은 자금은 융자로 총 6천만 원이었다. 회사 이름으로 받은 돈이었지만, 대표인 내가 개인 연대보증을 섰다.\n\n## 첫 녹음실\n\n[이미지7]\n\n그 돈으로 권리금 없는 녹음실을 인수했다. 직접 보수 공사를 해서 첫 법인 녹음실과 사무실을 꾸렸다.\n\n[이미지8]\n\n[이미지9]" }
    ]},
    { name: "3관 · 트리스 (TRISS)", floor: "#1f1c22",
      intro: "밴드 트리스(TRISS) 는 \"공상 과학\"에 영감을 받은\n신스팝 음악을 하는 밴드에요",
      introEn: "TRISS, alternative synth pop/rock band will drive you into the sci-fi world",   // 영문 소개: 바닥 아래쪽에 새겨짐
      works: [
      { id:"t01", year:"2018", title:"TRISS · Science and Fantasy", desc:"TRISS(트리스) - Science And Fantasy (Official Music Video)\n\n트리스(TRISS)의 타이틀곡 Science And Fantasy 는\n신스팝 사운드에 속도감 있는 리듬이 더해져 관객과 함께 떼창을 하며 신나게 놀 수 있는 곡입니다.\n공상과학을 나타내는 영어 단어인 Science Fiction 에서 Fiction 을 환상(Fantasy)로 바꿔본 아이디어로 시작 되었습니다.\n기술이 발전하며 점점 더 많은 것들이 과학(Science)의 통계와 계산에 의해 정해지는 현실 비판하며,\n상식과 편견에 연연해하지 말고 용감하게 자기 믿음대로 나아가자 라는 메세지를 담은 곡입니다.\n\n[Music Video Credit]\nDirector 이준의 @왓츠더웨더\nProducer 고호성 @왓츠더웨더\nManager By 함수빈\nArt Director 박찬송 @왓츠더웨더\nD.I By 김민희\nMaking PhotographerBy 이희선 @robotka\nHair & Make up 초월", say:"", note:"첫 미니앨범의 타이틀곡 「Science and Fantasy」 뮤직비디오예요. 저예산이었지만 정말 열심히 만들었어요.", youtube:"", video:"media/t01.mp4", image:"media/t01.jpg" },
      { id:"t02", year:"2018", title:"TRISS · Breaking Star (쇼케이스)", desc:"[TRISS SHOWCASE] 트리스(Triss) - Breaking Star", say:"", note:"홍대에 있는 클럽 프리버드를 대관해서 앨범 발매 쇼케이스도 열었어요.\n이 곡은 앨범 마지막곡 Breaking star 에요.", youtube:"", video:"media/t02.mp4", image:"media/t02.jpg" },
      { id:"t03", year:"2018", title:"TRISS · 1st EP 전곡 듣기", desc:"[Full Album] 트리스 (TRISS) 1st EP Science and Fantasy\n\n1. Come into Life\n2. Science and Fantasy\n3. Chasing Star\n4. Body and Soul\n5. Breaking Star\n\n신스팝밴드 TRISS(트리스)의 첫 번째 앨범 [SCIENCE AND FANTASY]가 2018년 2월 9일 발매 된다. 2016년 4월 첫 싱글 Ice cream을 시작으로 3개의 싱글 앨범을 발매하였고 2017년 상상마당 밴드디스커버리 우승, 부산 국제록페스티벌 부락배틀 금상을 수상하는 등 끊임없이 진화한 끝에 첫 번째 앨범을 발표한다.\n\n한편의 공상과학 영화를 보는 듯한 이번 앨범은 마치 지구를 떠나 미지의 세계를 탐험하는 우주 비행선을 연상케 한다. 이 여행은 차별과 억압에 대한 저항의 메시지를 품은 첫 번째 트랙 ‘Come into life’를 시작으로 발사대를 떠나, 이성과 감성의 전쟁터인 ‘Science and fantasy’에 도착해 한바탕 전쟁을 치른 뒤, 지구의 궤도를 벗어나 초광속 추진장치를 통과해 ‘Chasing star’를 부르며 수십만 광년을 날아 우주정거장에서 흘러나오는 ‘Body and soul’을 들으며 사랑을 하고, 승리의 세레모니 ‘Breaking star’를 부르며 막을 내린다.\n\n1st EP “Science and Fantasy”\nthe album as a whole makes you feel adventurous as if you are watching a sci-fi movie\nLaunching from the earth with the spirit of resistance, the first track [Come into life] sends out message to all the minorities in the space to come back to life. Caught up in a war between [Science and fantasy] they speed up through the worm hole singing  [Chasing star] hoping to find a new world. Listening to their fourth track [Body and soul], they find true love in a space station. Achieving victory by singing [Breaking star] the journey finally comes to an end.\n“space crew should be able to fix their space ship on their own” the reason why they wear ‘engineer like’ outfit lets you take a glimpse of their delightful attitude.\n\n[Album Credit]\nExecutive Produced By 김형민 @UniqueTunes Records\nProduced By RAY HILL, 양현덕\nComposed By 양현덕\nLyrics By 양현덕\nArranged By 양현덕\nVocal By 양현덕\nDrum By 신영권\nBass By 김민규\nSynth By Daisy Jung\nChorus By 양현덕, Daisy Jung, 신영권, 김민규\nMixed By RAY HILL @UniqueTunes Records\nMastered By RAY HILL @UniqueTunes Records\nManager By 함수빈\n\nArt Director &Photographer 황필주 @hwang_piljoo\nHair & Make up 초월\nStage PhotographerBy 이희선 @robotka\nLyrics Video By Daisy Jung, 박준형 From 줄리아드림", say:"", note:"앨범 전곡을 들어보실 수 있어요. 자켓 이미지 속 손은 베이스 김민규의 손이에요. 우주의 별을 표현한 이 사진은 아트디렉터 겸 포토그래퍼 황필주님이 찍어주셨어요.", youtube:"", video:"media/t03.mp4", image:"media/t03.jpg" },
      { id:"t04", year:"2019", title:"TRISS · Rolly Rolly", desc:"신스팝 밴드 트리스(TRISS) - Rolly Rolly\n\n트리스(TRISS)의 신곡 Rolly Rolly는 반복적인 신스 베이스가 인상적인 신스팝 곡이다.\n리더 양현덕의 자작곡을 바탕으로 멤버들의 개성 넘치는 연주가 더해져 트리스 특유의 청량함과 실험성이 돋보인다. 한번 듣고 따라 부르게 되는 쉬운 가사와 멜로디를 가진 듯하지만, 가사의 속뜻은 현대인의 심리적 불안을 담고 있다.\nRolly Rolly는 세계적인 명성을 얻고 있는 신스팝 듀오 LOVE X STEREO가 음악 프로듀싱을 맡아 곡의 완성도를 높였으며, 아트디렉터 겸 작가 황필주의 사진과 5TCB(5TimeCallBoi)의 비주얼 디렉팅이 더해져 트리스만의 유쾌한 뉴트로 스타일을 만들어 냈다.\n뮤직비디오(감독 안병선)에는 유명 틱톡커 소나@dancersona, 유니@yoonilee1022, 권자매@_gwonsister_ 가 출연해 트리스의 연주와 조화를 이뤄 신선한 볼거리를 선사한다.\n\nTRISS / 김민규(Bass), Daisy Jung(Synth), 신영권(Drum), 양현덕(Vocal)\nMusic Producer / Love X Stereo\n작사 / 양현덕\n작곡 / 양현덕, Love X Stereo\n편곡 / 양현덕, Love X Stereo\nRecording, Mixing, Mastering / Toby Hwang @ Love X Studio\nGuitars / Toby Hwang\nSynthesizers / Daisy Jung, Annie Ko\nChorus / 신영권, Daisy Jung, 김민규\n\n[Staff]\nExecutive Producer / 김형민\nSupervisor / Ray Hill\nArt Director, Photographer / 황필주\n의상 and Cover Design / 5TCB 김혜진\nInternational Marketing / 김정아 THE EVENTIST\n\n[Music Video]\nDirector / 안병선\nCo.Director / 이우빈 (wasabimayo)\nA.D / 최종현\nD.O.P / Lit(김주환, 임희철)\nGaffer / offthestudio\n\n후원 / 한국콘텐츠진흥원, 벅스, 벅스커넥트", say:"", note:"콘진원 지원사업에 선정되어서 찍은 뮤직비디오예요. 당시 핫한 틱톡커분들이 출연해 주셨어요.", youtube:"", video:"media/t04.mp4", image:"media/t04.jpg" },
      { id:"m3", wall:"bottom", type:"story", year:"2018", title:"음비맨의 회고록 3편", desc:"밴드 트리스와 함께한 시간", say:"음비맨의 회고록 3탄이에요. 밴드 트리스와 함께 캐나다, 브라질까지 날아갔던 이야기예요.", note:"음비맨의 회고록 3탄이에요. 밴드 트리스와 함께 캐나다, 브라질까지 날아갔던 이야기예요.",
        image:"media/m3-01.jpg", images:["media/m3-01.jpg", "media/m3-02.jpg", "media/m3-03.jpg", "media/m3-04.jpg", "media/m3-05.jpg", "media/m3-06.jpg", "media/m3-07.jpg"],
        text:"1편은 이렇게 끝났다.\n\n\"처음부터 세계를 향해 두드린다는 방향은 이 팀에서 시작됐고, 그 마음은 고스란히 다음 프로젝트로 이어진다.\"\n\n그 다음 프로젝트가 트리스(TRISS)다.\n\n이 글에는 캐나다 우승, 브라질 1만 명, 틱톡 6천만 뷰, 연합뉴스 보도 같은 장면이 나온다. 전부 사실이다.\n\n## 01. 한 밴드와의 만남\n\n로디아 프로젝트가 정리된 뒤, 나는 유니크튠즈를 이어가기 위해 음원 유통사의 운영 대행을 하고 있었다. 그 무렵 한 3인조 남성 밴드를 만났다.\n\n음악이 미쳤다. 리더 양현덕이 뽑아내는 탑라인은 홍대 클럽 바닥에서 쉽게 만날 수 없는 종류의 영리함이 있었다. 80년대 신스팝과 공상과학 사운드트랙 사이 어딘가에서 온 것 같은, 듣는 순간 무언가가 당기는 질감이었다. 나는 내가 기획하던 공연에 그들을 올렸다.\n\n공연이 끝난 뒤, 나는 멤버들과 마주 앉았다.\n\n\"처음부터 글로벌을 타겟으로 설계하자. 무대 위 쇼맨십과 신스 사운드, 비주얼 아트를 책임질 강력한 카드가 필요하다.\"\n\n그렇게 여성 신디사이저 멤버 데이지(Daisy Jung)가 합류했다. 연주와 서브 보컬뿐 아니라, 무대용 비주얼 아트 영상까지 직접 제작할 수 있는 멤버였다. 유니크튠즈와 트리스의 연대기가 그렇게 시작되었다.\n\n## 02. 황필주의 우주복과 '내 손 안의 우주'\n\n[이미지1]\n\n지향점은 처음부터 명확했다.\n\n60년대 아방가르드 패션에서 영감을 받은 '미친 과학자의 우주복'. 장르는 80년대 신스팝 사운드에 공상과학 영화의 상상력을 더한 것. 가사는 전곡 영어. 해외 음악 매거진 평론가의 눈에 '작품'으로 보여야 했다.\n\n이 세계관을 시각적으로 담기 위해 황필주 포토그래퍼가 아트 디렉터로 함께했다. (황필주는 내 친구라는 이유로 몇 년간 함께 고생해 주었다. 레이힐과 더불어 가장 고마운 사람 중 하나다.)\n\n그의 감각은 아방가르드라는 단어가 그대로 어울리는 수준이었다. 베이스 담당 김민규의 손에 직접 물감을 칠해 앨범 자켓 이미지를 뽑아냈다. 멤버들이 입은 우주복 위에는 가사를 덕지덕지 붙였다. 앨범 자켓 컨셉은 '내 손 안의 우주'. 손으로 연주하는 밴드가, 손 위에 우주를 담는다는 은유였다.\n\n[이미지2]\n\n2018년 2월 9일, 1st EP 〈SCIENCE & FANTASY〉가 발매됐다. 5개의 트랙은 하나의 공상과학 영화처럼 설계되어 있었다. 지구를 떠나 우주를 여행하고, 외계의 적과 싸우고, 마침내 귀환하는 서사. 쇼케이스에 초청된 평론가들의 반응은 뜨거웠다.\n\n[이미지3]\n\n\"진짜 가볼 수 있겠다\"는 확신이 처음으로, 데이터가 아닌 감각으로 왔다.\n\n그 직후 라이브 클럽 데이 3주년 공연 무대에 섰다. 레전드 크라잉넛, 그리고 당시 막 씬의 괴물 신인으로 떠오르던 새소년과 메인 라인업을 공유했다. 네이버 V-LIVE가 전 세계로 실시간 생중계되던 순간, 트리스가 그 무대 위에 있었다.\n\n그해 8월, 네이버 온스테이지 392번째 무대로 선정됐다. 그 화면에 트리스의 '사이언스 픽션 뮤직'이 온에어 되던 날, 나는 이 일을 시작하고 처음으로 순수하게만 기뻤다.\n\n## 03. 토론토, 16개국 250팀 대 트리스 4명\n\n1편에서 Sonicbids를 통해 전 세계 쇼케이스에 제안서를 보냈다고 썼다. 트리스와 함께 그 작업을 다시 시작했다. 이번엔 쌓인 커리어와 선명한 컨셉 덱(Deck)이 있었다.\n\n2018년 11월, 우리는 캐나다 토론토에 있었다.\n\nINDIE WEEK CANADA. 캐나다에서 열리는 북미 최대 규모의 인디 뮤직 경연이자 컨퍼런스였다. 16개국에서 250여 팀이 모였다. 트리스는 토론토의 여러 클럽 무대를 순차적으로 통과하며 결선까지 올라갔다. 수상식 무대에서, 진행자가 Best of Fest — 그러니까 1위 수상자의 이름을 불렀다.\n\nTRISS.\n\n[이미지4]\n\nIndie Week 공식 아티스트 페이지에는 지금도 트리스의 이력이 이렇게 남아 있다. \"Indie Week Canada 2018에서 Best of Fest(1위)로 선정, 2019년 브라질리아 CoMA 페스티벌에 헤드라이너로 공식 초청됨.\" 한 줄짜리 영어 문장이지만, 나에게는 12년 중 가장 멀리 날아간 좌표값이다.\n\n홍대 클럽에서 시작한 밴드가, 16개국 팀들과 겨뤄 북미 경연 1위를 했다. 우승의 부상으로는 브라질 CoMA 페스티벌 헤드라이너 초청장이 따라왔다. 네이버 메인 페이지에 트리스의 이름이 올라갔다.\n\n이 커리어로 제안서를 돌린 결과, 인디 씬의 오래된 로망이었던 인천 펜타포트 록 페스티벌 무대를 계약해 냈다.\n\n## 04. 브라질 1만 명의 떼창\n\n[이미지5]\n\n2019년 8월, 브라질리아. CoMA 페스티벌 헤드라이너.\n\n야외 스테이지를 가득 메운 1만여 명의 관객들 앞에서 싱글 〈Rolly Rolly〉의 전주가 울렸다. 브라질 사람들이 영어 가사를 따라 불렀다. 홍대 지하 클럽에서 우주복을 꿰매던 밴드가, 지구 반대편 남미 메이저 페스티벌의 헤드라이너 자리에 서 있었다. 그해 〈Rolly Rolly〉의 틱톡 챌린지 영상은 6천만 뷰를 넘어갔다. 이 믿기지 않는 이야기는 연합뉴스에도 실렸다.\n\n[이미지6]\n\n그해 11월에는 캐나다 몬트리올 'M for Montreal' 페스티벌에도 초청받아 무대에 섰다.\n\n## 05. 2020년\n\n나는 리더 양현덕이 온스테이지 지원서에 직접 썼던 문장을 아직도 기억한다. 홍대에서 밴드를 시작한 지 14년 차에 트리스를 시작하며, 그는 이렇게 썼다. \"지금까지 해오던 일들을 전부 버리고 마지막이라 다짐하며 시작했던 프로젝트가 지금의 트리스입니다.\"\n\n2020년, 더 넓게 해외로 나가려던 그때 코로나19가 터졌다. 트리스가 향하던 하늘길을 전 세계가 일제히 닫아버렸다.\n\n그리고 트리스는 활동을 멈췄다.\n\n## 06. 트리스의 기록\n\n16개국 경연 1위, 남미 1만 명 앞의 헤드라이너, 6천만 뷰의 틱톡 챌린지, 연합뉴스 보도. 처음부터 세계를 향해 설계했던 방향은, 트리스와 함께 실제로 증명됐다.\n\n트리스는 유니크튠즈 12년 중 가장 멀리 날아간 팀이었고, 그래서 가장 오래 마음에 남는 장(章)이다.\n\n[TRISS - TIME IS NOW ] - 제작자로서 가장 애착이 가는 영상이다.\n\n[브라질 CoMA 페스티벌]\n\n[이미지7]\n\n밴드 트리스 (TRISS) 의 기록.\n\n멤버 구성: 양현덕(보컬/리더), 신현권(드럼), 데이지(신디사이저), 김민규(베이스)\n\n## 주요 연혁\n\n2016년 데뷔 싱글 발매 / 네이버뮤직 'Imagine Your Music' 이달의 뮤지션 선정\n\n2017년 라이브클럽데이 오픈쇼케이스 오디션 우승 / 부산 국제록페스티벌 부락배틀 '금상' 수상 / KT&G 상상마당 밴드디스커버리 우승\n\n2018년 1st 미니앨범 공식 발매 / 라이브클럽데이 3주년 기념 공연 / 캐나다 'INDIE WEEK CANADA 2018' 최종 우승 (BEST OF FEST, 250여 팀 중 1위) / 인천 펜타포트 록 페스티벌 '펜타루키' TOP 6 / KBS '인디스땅스' TOP 6 선정\n\n2019년 KBS <육중완의 올댓뮤직>, <SBS 더쇼> 출연 / 브라질 'CoMA 페스티벌(Festival CoMA)' 공식 헤드라이너 / 브라질 상파울루 단독 콘서트 개최 / 캐나다 몬트리올 'M for Montreal' 페스티벌 공식 초청 및 쇼케이스 진행\n\n2020년 <아시안 탑밴드 코리아> 최종 TOP 6 진출\n\n글을 쓰고 보니, 트리스 멤버들, 프로듀싱을 맡았던 레이힐, 애써주었던 황필주 아트디렉터, 투어감독을 맡아준 김정아 감독님, 파탈, 혜진님, 그리고 늘 응원해준 우리 와이프님에게 모두 진심으로 고맙다." },
      { id:"a3", wall:"bottom", type:"story", year:"2019", title:"트리스 기획서 아카이브", desc:"2019 해외진출 온라인 홍보 지원사업 수행계획서", say:"정부 지원사업 자금을 유치하기 위해 작성했던 자료예요. 트리스의 브라질 공연을 이렇게 기획했어요.", note:"정부 지원사업 자금을 유치하기 위해 작성했던 자료예요. 트리스의 브라질 공연을 이렇게 기획했어요.",

        text:"2019년, 브라질 CoMA 페스티벌 초청을 앞두고 쓴 지원사업 수행계획서입니다. 실제 제출했던 문서 그대로예요. (일부 수치는 가렸습니다)\n\n## 과제 세부계획\n\n[이미지1]\n\n페스티벌 무대 한 번으로 끝내지 않고, 영상 제작·사전 프로모션·상파울루 단독공연까지 이어가겠다는 계획이었습니다.\n\n## 아티스트 소개\n\n[이미지2]\n\n## 해외 공연 계획\n\n[이미지3]\n\n## 무대 구성\n\n[이미지4]\n\n## 영상 콘텐츠 제작 계획\n\n[이미지5]\n\n## 해외진출 전략과 홍보 계획\n\n[이미지6]\n\n## 첨부 · INDIE WEEK CANADA 2018\n\n[이미지7]" }

</div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const C = CONFIG;
const el = (tag, cls, text) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
const store = {

const COLORS = ["#f3c26b","#e86a5a","#6fb7a8","#8aa4e6","#c995e0","#f1e9df"];

// 음비맨 도슨트 얼굴 (미모지 기반 일러스트). talk=true 이면 입을 벌린 프레임.
function umbiFaceSVG(talk){

  <path d="M66 34 Q100 14 140 28" stroke="#3d3330" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>

  <circle cx="82" cy="110" r="5.2" fill="#3b2a22"/><circle cx="122" cy="110" r="5.2" fill="#3b2a22"/>
  <circle cx="84" cy="108" r="1.7" fill="#fff"/><circle cx="124" cy="108" r="1.7" fill="#fff"/>
  <!-- glasses -->
  <rect x="59" y="96" width="40" height="27" rx="8" fill="rgba(255,255,255,.08)" stroke="${frame}" stroke-width="3.5"/>
  <rect x="101" y="96" width="40" height="27" rx="8" fill="rgba(255,255,255,.08)" stroke="${frame}" stroke-width="3.5"/>
  <path d="M99 106 Q100 103 101 106" stroke="${frame}" stroke-width="3" fill="none"/>
  <path d="M59 104 L48 102 M141 104 L152 102" stroke="${frame}" stroke-width="3"/>
  <!-- nose -->
  <path d="M100 116 Q93 136 98 140 Q104 142 107 138" stroke="${skinD}" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- mustache -->
  <path d="M100 148 Q86 142 74 152 Q70 156 66 152 Q72 162 86 156 Q95 152 100 153 Q105 152 114 156 Q128 162 134 152 Q130 156 126 152 Q114 142 100 148 Z" fill="${beard}"/>
  ${mouth}
  <!-- goatee -->
  <path d="M90 178 Q100 174 110 178 Q108 196 100 204 Q92 196 90 178 Z" fill="${beard}"/>
</svg>`;
}
const UMBI=[false,true].map(t=>{ const im=new Image(); im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(umbiFaceSVG(t)); return im; });
const UMBI_SRC=UMBI[0].src;
const LOGO=new Image(); LOGO.src="media/logo.png";

/* =================== WORLD GEOMETRY =================== */
const WALL = 120;          // 작품이 걸리는 윗벽 높이
const H = 620;             // 전시실 바닥 끝
const R = 14;              // 캐릭터 반지름
const DOOR = [310, 440];   // 전시실 사이 문 (y 구간)
const DOORY = (DOOR[0]+DOOR[1])/2;
const rooms = [];
let wx = 0;
rooms.push({ name:"로비", floor:"#1c1714", x:0, w:620, works:[{id:"guestbook", type:"guestbook", title:"방명록"}], lobby:true });
wx = 620;
C.rooms.forEach(r=>{ const top=r.works.filter(w=>w.wall!=="bottom").length, bot=r.works.length-top; const w = Math.max(r.introEn ? 980 : 620, Math.max(top,bot)*240+160); rooms.push({ ...r, x:wx, w, hasBottom: bot>0 }); wx += w; });
const WORLD_W = wx, WORLD_H = H + 20;
const frames = [];
rooms.forEach((r,ri)=>{
  const top=r.works.filter(w=>w.wall!=="bottom"), bot=r.works.filter(w=>w.wall==="bottom");
  top.forEach((wk,i)=>{
    const fx = r.x + (i+1)*r.w/(top.length+1);
    frames.push({ ...wk, room:ri, x:fx, y:62, w: (wk.type && wk.type!=="story") ? 132 : 168, h: (wk.type && wk.type!=="story") ? 82 : 96, vx:fx, vy:WALL+46 });
  });
  // 아래쪽: 바닥에 세운 전시 패널
  bot.forEach((wk,i)=>{
    const fx = r.x + (i+1)*r.w/(bot.length+1);
    frames.push({ ...wk, room:ri, x:fx, y:H-128, w:150, h:84, vx:fx, vy:H-30, panel:true });
  });
});
const bounds = rooms.slice(1).map(r=>r.x);
function roomAt(x){ for(let i=rooms.length-1;i>=0;i--) if(x>=rooms[i].x) return i; return 0; }
function valid(x,y){
  if(x<R || x>WORLD_W-R || y<WALL+R || y>H-R) return false;
  for(const bx of bounds){ if(Math.abs(x-bx)<10+R && !(y>DOOR[0]+R && y<DOOR[1]-R)) return false; }
  return true;
}

/* youtube + thumbnails */
function ytId(u){
  if(!u) return "";
  const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
  return m? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(u)? u : "");
}
frames.forEach(f=>{
  f.yt = ytId(f.youtube);
  const src = f.image || (f.type==="story" && f.images && f.images[0]) || (f.yt && C.embedYouTube ? "https://i.ytimg.com/vi/"+f.yt+"/hqdefault.jpg" : "");
  if(src){ const im=new Image(); im.src=src; f.img=im; }
});

/* =================== STATE =================== */
let ticket = store.get("ut12_ticket2");
let color = (ticket && ticket.color) || COLORS[0];
const me = { x: 140, y: DOORY, dir: 1, moving:false, bob:0, emote:null };
const keys = {};
let path = [];             // waypoints for click-to-move
const guide = { x: 250, y: DOORY+120, dir:1, point:1, moving:false, say:"", focus:null, greetUntil:0, greet2Until:0, approachUntil:0, approachNext:0, room:0, roomSay:"", roomSayUntil:0, seen:{} };
const trail = [];          // 관객이 지나간 길 (음비맨이 따라 걷는 경로)
let pendingOpen = null;    // frame to open on arrival
let near = null;
let modalFrame = null;
let room = null;           // live room capability
const others = new Map();  // peer -> {x,y,tx,ty,nick,color,dir,emote,moving,w}
let db=null, uid=null, isOwner=false, canWrite=false, visitors=[], myDoc=null, dbState="loading";

/* =================== GATE =================== */
$("gTitle").textContent = C.title; $("gSub").textContent = C.subtitle;
$("tTitle").textContent = C.title;
COLORS.forEach(c=>{ const b=el("button","sw"+(c===color?" on":"")); b.type="button"; b.style.background=c; b.setAttribute("aria-label","색 선택");
  b.onclick=()=>{ color=c; document.querySelectorAll(".sw").forEach(s=>s.classList.toggle("on",s===b)); }; $("colors").append(b); });
if(ticket){ $("nickIn").value=ticket.nick; $("tName").textContent=ticket.nick; $("tNo").textContent=ticket.no; }
$("gateForm").addEventListener("submit", e=>{
  e.preventDefault();

  ticket = { nick, color, no: ticket ? ticket.no : "UT12-"+(Math.floor(Math.random()*9000)+1000) };
  store.set("ut12_ticket2", ticket);
  $("tName").textContent=nick; $("tNo").textContent=ticket.no;

  setTimeout(enter, 900);
});
function enter(){

  $("gate").classList.add("hidden");
  ["hudTop","hudBot","minimap"].forEach(id=>$(id).classList.remove("hidden"));

  startLive(); startDb();
}

/* =================== CANVAS =================== */
const cv=$("world"), cx=cv.getContext("2d");
const mm=$("minimap"), mx=mm.getContext("2d");
let VW=0, VH=0, DPR=1, scale=1, camX=0, camY=0;
const MMW=200, MMH=Math.round(200*WORLD_H/WORLD_W)+0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2); VW=innerWidth; VH=innerHeight;
  cv.width=VW*DPR; cv.height=VH*DPR; cv.style.width=VW+"px"; cv.style.height=VH+"px";
  scale=Math.max(.55,Math.min(1.25,(VH-60)/(WORLD_H+80)));
  const mw = VW<600 ? 130 : MMW, mh = Math.max(28, Math.round(mw*WORLD_H/WORLD_W));
  mm.width=mw*DPR; mm.height=mh*DPR; mm.style.width=mw+"px"; mm.style.height=mh+"px"; mm._w=mw; mm._h=mh;
}
addEventListener("resize",resize); resize();

function toWorld(px,py){ return { x: px/scale+camX, y: py/scale+camY }; }

function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function drawWorld(t){
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.fillStyle="#080606"; cx.fillRect(0,0,VW,VH);
  // camera
  const vw=VW/scale, vh=VH/scale;
  camX = WORLD_W<vw ? (WORLD_W-vw)/2 : Math.max(0,Math.min(WORLD_W-vw, me.x-vw/2));
  camY = WORLD_H+40<vh ? (WORLD_H-vh)/2 + 10 : Math.max(-20,Math.min(WORLD_H+20-vh, me.y-vh/2));
  cx.setTransform(DPR*scale,0,0,DPR*scale,-camX*DPR*scale,-camY*DPR*scale);

  rooms.forEach((r,ri)=>{
    // floor
    cx.fillStyle=r.floor; cx.fillRect(r.x,WALL,r.w,H-WALL);
    cx.strokeStyle="rgba(255,255,255,.025)"; cx.lineWidth=1;
    for(let y=WALL+28;y<H;y+=28){ cx.beginPath(); cx.moveTo(r.x,y); cx.lineTo(r.x+r.w,y); cx.stroke(); }
    // floor title
    if(r.lobby && LOGO.complete && LOGO.naturalWidth){ const lw=420, lh=lw*LOGO.naturalHeight/LOGO.naturalWidth; cx.globalAlpha=.08; cx.drawImage(LOGO, r.x+r.w/2-lw/2, H-80-lh/2, lw, lh); cx.globalAlpha=1; }
    else if(!r.introEn && !r.intro){ cx.fillStyle="rgba(241,233,223,.06)"; cx.font="700 54px 'Gowun Batang'"; cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText(r.lobby ? C.label : r.name, r.x+r.w/2, r.hasBottom ? WALL+170 : H-80); }
    if(r.intro){
      cx.fillStyle="rgba(241,233,223,.32)"; cx.font="400 15px 'Gowun Batang'"; cx.textAlign="center"; cx.textBaseline="middle";
      const iy = WALL+98;
      r.intro.split("\n").forEach((ln,i)=>cx.fillText(ln, r.x+r.w/2, iy+i*24));
    }
    if(r.introEn){
      const maxW=r.w-90; let y=WALL+160;
      r.introEn.split("\n").forEach((para,pi)=>{
        cx.font = pi===0 ? "600 13px 'IBM Plex Sans KR'" : "400 11.5px 'IBM Plex Sans KR'";
        cx.fillStyle = pi===0 ? "rgba(243,194,107,.42)" : "rgba(241,233,223,.26)";
        cx.textAlign="center"; cx.textBaseline="middle";
        const words=para.split(" "); let line="";
        const flush=()=>{ if(line){ cx.fillText(line, r.x+r.w/2, y); y+= pi===0?20:16; line=""; } };
        words.forEach(w=>{ const t=line?line+" "+w:w; if(cx.measureText(t).width>maxW){ flush(); line=w; } else line=t; });
        flush(); y+=8;
      });
    }
    // wall
    const g=cx.createLinearGradient(0,0,0,WALL); g.addColorStop(0,"#3a302a"); g.addColorStop(1,"#2b231f");
    cx.fillStyle=g; cx.fillRect(r.x,0,r.w,WALL);
    cx.fillStyle="#120e0c"; cx.fillRect(r.x,WALL-6,r.w,6);
    // room plaque on wall
    cx.fillStyle="rgba(243,194,107,.8)"; cx.font="500 11px 'IBM Plex Mono'"; cx.textAlign="left";
    cx.fillText((r.lobby?"LOBBY":"ROOM "+ri)+"  ·  "+r.name, r.x+18, 16);
  });
  // lobby wall logo
  if(LOGO.complete && LOGO.naturalWidth){ const lw=200, lh=lw*LOGO.naturalHeight/LOGO.naturalWidth; cx.globalAlpha=.9; cx.drawImage(LOGO, 495-lw/2, 58-lh/2, lw, lh); cx.globalAlpha=1; }
  // lobby entrance text
  cx.fillStyle="rgba(241,233,223,.9)"; cx.font="700 26px 'Gowun Batang'"; cx.textAlign="center";
  C.title.split("\n").forEach((ln,i)=>cx.fillText(ln, 310, WALL+96+i*34));
  cx.fillStyle="rgba(168,154,140,.9)"; cx.font="400 13px 'IBM Plex Sans KR'";
  cx.fillText(C.subtitle, 310, WALL+164);
  cx.fillText("→ 오른쪽 문으로 전시실이 이어집니다", 310, WALL+190);
  // red carpet through doors
  cx.fillStyle="rgba(125,24,36,.28)"; cx.fillRect(40,DOORY-26,WORLD_W-80,52);

  // dividing walls
  bounds.forEach(bx=>{
    cx.fillStyle="#120e0c";
    cx.fillRect(bx-10,WALL,20,DOOR[0]-WALL); cx.fillRect(bx-10,DOOR[1],20,H-DOOR[1]);
    cx.fillStyle="#3a302a"; cx.fillRect(bx-10,0,20,WALL);
  });
  // outer walls
  cx.fillStyle="#120e0c"; cx.fillRect(0,H,WORLD_W,14); cx.fillRect(-14,0,14,H+14); cx.fillRect(WORLD_W,0,14,H+14);

  // frames (wall)
  frames.forEach(f=>{
    if(f.panel) return;
    const isNear = near===f;
    // floor spotlight
    const sg=cx.createRadialGradient(f.x,WALL+10,4,f.x,WALL+10,isNear?150:120);
    sg.addColorStop(0,isNear?"rgba(243,194,107,.28)":"rgba(243,194,107,.14)"); sg.addColorStop(1,"rgba(243,194,107,0)");
    cx.fillStyle=sg; cx.beginPath(); cx.ellipse(f.x,WALL+10,isNear?150:120,70,0,0,Math.PI*2); cx.fill();
    // wall glow
    const wg=cx.createRadialGradient(f.x,f.y,10,f.x,f.y,f.w*.9);
    wg.addColorStop(0,"rgba(255,223,158,.18)"); wg.addColorStop(1,"rgba(255,223,158,0)");
    cx.fillStyle=wg; cx.fillRect(f.x-f.w,0,f.w*2,WALL-6);
    drawFace(f);
    // lamp
    cx.fillStyle="#1a1411"; cx.fillRect(f.x-14,4,28,6);
    drawPlaque(f, WALL+22);
  });

  // avatars (sorted by y)
  const list=[...others.values()].map(o=>({...o,isMe:false}));
  frames.forEach(f=>{ if(f.panel) list.push({ y:f.y+f.h/2+34, panel:f }); });
  list.push({ x:me.x, y:me.y, nick:ticket?ticket.nick:"", color, dir:me.dir, moving:me.moving, emote:me.emote, isMe:true });
  if(ticket) list.push({ x:guide.x, y:guide.y, nick:C.host||"음비맨", npc:true, talk:!!guide.say, moving:guide.moving, dir:guide.dir, point:guide.point });
  list.sort((a,b)=>a.y-b.y).forEach(a=> a.panel ? drawPanel(a.panel) : drawAvatar(a,t));
  if(ticket && guide.say){ if((guide.focus && !guide.focus.panel) || (!guide.focus && (guide.say===C.hostGreeting || guide.say===C.hostGreeting2 || guide.say===C.hostApproach || (guide.say===guide.roomSay && !rooms[roomAt(guide.x)].introEn)))) drawSayAt(guide.x, guide.y+42, guide.say, true); else drawSayAt(guide.x, guide.y-64, guide.say); }
}
function drawFace(f){
    const fx=f.x-f.w/2, fy=f.y-f.h/2;
    if(f.type==="guestbook"){
      cx.fillStyle="#5a3b22"; roundRect(cx,fx-6,fy-6,f.w+12,f.h+12,4); cx.fill();
      cx.fillStyle="#c8a77a"; cx.fillRect(fx,fy,f.w,f.h);
      const notes=["#f4e7cf","#f3c26b","#e6d1ad","#f6ead4","#e9b7a6"];
      for(let i=0;i<9;i++){ cx.fillStyle=notes[i%5]; cx.save(); cx.translate(fx+18+(i%3)*44, fy+16+Math.floor(i/3)*24); cx.rotate((i%2?-1:1)*.08); cx.fillRect(-14,-9,28,18); cx.restore(); }
    } else if(f.type==="letter"){
      cx.fillStyle="#3a0f15"; roundRect(cx,fx-6,fy-6,f.w+12,f.h+12,4); cx.fill();
      cx.fillStyle="#f4e7cf"; cx.fillRect(fx,fy,f.w,f.h);
      cx.fillStyle="#7d1824"; cx.font="700 15px 'Gowun Batang'"; cx.textAlign="center"; cx.fillText("고맙습니다", f.x, f.y-6);
      cx.fillStyle="rgba(42,29,21,.5)"; cx.fillRect(f.x-36,f.y+10,72,2); cx.fillRect(f.x-28,f.y+18,56,2);
    } else {
      cx.fillStyle="#b08a45"; roundRect(cx,fx-7,fy-7,f.w+14,f.h+14,3); cx.fill();
      cx.fillStyle="#6e5226"; cx.fillRect(fx-2,fy-2,f.w+4,f.h+4);
      cx.fillStyle="#0c0908"; cx.fillRect(fx,fy,f.w,f.h);
      if(f.img && f.img.complete && f.img.naturalWidth){
        const im=f.img, s=Math.max(f.w/im.naturalWidth,f.h/im.naturalHeight), iw=im.naturalWidth*s, ih=im.naturalHeight*s;
        cx.save(); cx.beginPath(); cx.rect(fx,fy,f.w,f.h); cx.clip(); cx.drawImage(im,f.x-iw/2,f.y-ih/2,iw,ih); cx.restore();
        cx.fillStyle="rgba(0,0,0,.25)"; cx.fillRect(fx,fy,f.w,f.h);
      }
      // play glyph
      const ready = f.type==="story" ? !!f.text : (f.video||f.yt);
      cx.fillStyle = ready ? "rgba(243,194,107,.95)" : "rgba(243,194,107,.35)";
      if(f.type==="story"){ // open book
        cx.beginPath(); cx.moveTo(f.x,f.y-8); cx.quadraticCurveTo(f.x-10,f.y-13,f.x-20,f.y-10); cx.lineTo(f.x-20,f.y+10); cx.quadraticCurveTo(f.x-10,f.y+7,f.x,f.y+12); cx.quadraticCurveTo(f.x+10,f.y+7,f.x+20,f.y+10); cx.lineTo(f.x+20,f.y-10); cx.quadraticCurveTo(f.x+10,f.y-13,f.x,f.y-8); cx.fill();
        cx.strokeStyle="rgba(12,9,8,.7)"; cx.lineWidth=1.5; cx.beginPath(); cx.moveTo(f.x,f.y-8); cx.lineTo(f.x,f.y+12); cx.stroke();
      } else { cx.beginPath(); cx.moveTo(f.x-9,f.y-12); cx.lineTo(f.x+13,f.y); cx.lineTo(f.x-9,f.y+12); cx.closePath(); cx.fill(); }
      if(!ready){ cx.fillStyle="rgba(168,154,140,.6)"; cx.font="500 9px 'IBM Plex Mono'"; cx.textAlign="center"; cx.fillText("COMING SOON", f.x, f.y+28); }
    }
}
function drawPlaque(f,py){
    cx.fillStyle="rgba(241,233,223,.92)"; cx.font="600 13px 'IBM Plex Sans KR'"; cx.textAlign="center"; cx.textBaseline="middle";
    cx.fillText(f.title, f.x, py);
    const cnt = commentCount(f.id);
    cx.fillStyle="rgba(168,154,140,.85)"; cx.font="400 11px 'IBM Plex Mono'";
    const sub = f.type==="guestbook" ? (cnt? cnt+"장의 글" : "글 남기기") : f.type==="letter" ? "" : (f.year||"") + (cnt? "  ·  💬 "+cnt : "");
    if(sub) cx.fillText(sub, f.x, py+18);
}
function drawPanel(f){
  const isNear = near===f, base=f.y+f.h/2+34;
  const sg=cx.createRadialGradient(f.x,base,4,f.x,base,isNear?130:105);
  sg.addColorStop(0,isNear?"rgba(243,194,107,.26)":"rgba(243,194,107,.13)"); sg.addColorStop(1,"rgba(243,194,107,0)");
  cx.fillStyle=sg; cx.beginPath(); cx.ellipse(f.x,base,isNear?130:105,46,0,0,Math.PI*2); cx.fill();
  cx.fillStyle="rgba(0,0,0,.45)"; cx.beginPath(); cx.ellipse(f.x,base,f.w/2+6,8,0,0,Math.PI*2); cx.fill();
  cx.fillStyle="#2a211c"; cx.fillRect(f.x-f.w/2+14,f.y+f.h/2,6,34); cx.fillRect(f.x+f.w/2-20,f.y+f.h/2,6,34);
  cx.fillStyle="#3a302a"; roundRect(cx,f.x-f.w/2-12,f.y-f.h/2-40,f.w+24,f.h+50,6); cx.fill();
  drawFace(f);
  drawPlaque(f, f.y-f.h/2-26);
}
function hostLine(f){
  if(f.say) return f.say;
  if(f.note){ const m=f.note.split(/(?<=[.!?。])\s|\n/)[0]; return m.length>60? m.slice(0,58)+"…" : m; }
  return "소개 준비 중이에요";
}
function wrapText(text,maxW){
  const out=[]; let line="";
  for(const ch of text){ const tl=line+ch; if(cx.measureText(tl).width>maxW && line){ out.push(line); line=ch; } else line=tl; }
  if(line) out.push(line); return out.slice(0,5);
}
function drawSayAt(x,y,text,below){
  cx.font="400 12px 'IBM Plex Sans KR'"; cx.textAlign="left"; cx.textBaseline="top";
  const lines=wrapText(text,210);
  const w=Math.max(...lines.map(l=>cx.measureText(l).width))+22, h=lines.length*17+14;
  const bx=Math.max(6, Math.min(x-24, WORLD_W-w-6)), by= below ? y+8 : y-h;
  cx.fillStyle="rgba(244,231,207,.97)"; roundRect(cx,bx,by,w,h,10); cx.fill();
  cx.beginPath();
  if(below){ cx.moveTo(x-6,by); cx.lineTo(x+6,by); cx.lineTo(x,by-8); } else { cx.moveTo(x-6,by+h); cx.lineTo(x+6,by+h); cx.lineTo(x,by+h+8); }
  cx.fill();
  cx.fillStyle="#2a1d15"; lines.forEach((l,i)=>cx.fillText(l,bx+11,by+8+i*17));
  cx.textBaseline="middle";
}

function drawDocent(a,t){
  const talking=a.talk, bob=a.moving? Math.abs(Math.sin(t/120))*3 : 0;
  const x=a.x, y=a.y-bob;
  cx.fillStyle="rgba(0,0,0,.45)"; cx.beginPath(); cx.ellipse(a.x,a.y+14,17,6,0,0,Math.PI*2); cx.fill();
  // body (jacket)
  cx.fillStyle="#262a33"; roundRect(cx,x-16,y-8,32,24,9); cx.fill();
  cx.fillStyle="#f1e9df"; cx.beginPath(); cx.moveTo(x-6,y-8); cx.lineTo(x+6,y-8); cx.lineTo(x,y+4); cx.closePath(); cx.fill();
  // pointing arm
  const lift = talking ? Math.sin(t/260)*3 : 0;
  cx.strokeStyle="#262a33"; cx.lineWidth=7; cx.lineCap="round"; cx.beginPath();
  const pd = a.point||1;
  if(talking){ cx.moveTo(x+12*pd,y-3); cx.lineTo(x+26*pd,y-20+lift); } else { cx.moveTo(x+13,y-3); cx.lineTo(x+17,y+10); }
  cx.stroke();
  cx.fillStyle="#f3cdb0"; cx.beginPath(); talking? cx.arc(x+27*pd,y-22+lift,4.5,0,7) : cx.arc(x+17,y+12,4,0,7); cx.fill();
  // head
  const im = UMBI[talking && Math.floor(t/170)%2 ? 1 : 0];
  if(im.complete) cx.drawImage(im, x-25, y-60, 50, 55);
  // name
  cx.font="600 11px 'IBM Plex Sans KR'"; cx.textAlign="center"; cx.textBaseline="middle";
  const name=a.nick, tw=cx.measureText(name).width+14;
  cx.fillStyle="rgba(166,34,51,.95)"; roundRect(cx,x-tw/2,y+20,tw,17,8); cx.fill();
  cx.fillStyle="#f1e9df"; cx.fillText(name,x,y+29);
}
function drawAvatar(a,t){
  if(a.npc) return drawDocent(a,t);
  const bob = a.moving ? Math.abs(Math.sin(t/110))*3 : 0;
  const x=a.x, y=a.y-bob;
  cx.fillStyle="rgba(0,0,0,.4)"; cx.beginPath(); cx.ellipse(a.x,a.y+12,13,5,0,0,Math.PI*2); cx.fill();
  // body
  cx.fillStyle=a.color||"#f1e9df"; roundRect(cx,x-11,y-4,22,17,7); cx.fill();
  // head
  cx.beginPath(); cx.arc(x,y-12,11,0,Math.PI*2); cx.fill();
  cx.fillStyle="rgba(255,255,255,.25)"; cx.beginPath(); cx.arc(x-3,y-16,4,0,Math.PI*2); cx.fill();
  // eyes
  cx.fillStyle="#1b120c"; const ex=(a.dir||1)*3;
  cx.beginPath(); cx.arc(x-3+ex,y-12,1.8,0,Math.PI*2); cx.arc(x+3+ex,y-12,1.8,0,Math.PI*2); cx.fill();
  if(a.isMe){ cx.strokeStyle="rgba(243,194,107,.9)"; cx.lineWidth=1.5; cx.beginPath(); cx.ellipse(a.x,a.y+12,17,7,0,0,Math.PI*2); cx.stroke(); }
  // name
  const name=(a.nick||"관객").slice(0,12);
  cx.font="500 11px 'IBM Plex Sans KR'"; cx.textAlign="center"; cx.textBaseline="middle";
  const tw=cx.measureText(name).width+12;
  cx.fillStyle=a.isMe?"rgba(243,194,107,.92)":a.npc?"rgba(166,34,51,.95)":"rgba(10,8,7,.75)"; roundRect(cx,a.x-tw/2,a.y+20,tw,17,8); cx.fill();
  cx.fillStyle=a.isMe?"#1b120c":"#f1e9df"; cx.fillText(name,a.x,a.y+29);
  // emote bubble
  if(a.emote && performance.now()-a.emote.t<2200){
    const age=(performance.now()-a.emote.t)/2200, ey=y-40-age*18;
    cx.globalAlpha=1-Math.max(0,age-.6)/.4;
    cx.fillStyle="rgba(241,233,223,.95)"; roundRect(cx,x-17,ey-15,34,30,12); cx.fill();
    cx.beginPath(); cx.moveTo(x-5,ey+14); cx.lineTo(x+5,ey+14); cx.lineTo(x,ey+21); cx.fill();
    cx.font="18px sans-serif"; cx.fillText(a.emote.e,x,ey+1);
    cx.globalAlpha=1;
  }
}

function drawMinimap(){
  const w=mm._w, h=mm._h, s=w/WORLD_W;
  mx.setTransform(DPR,0,0,DPR,0,0); mx.clearRect(0,0,w,h);
  rooms.forEach((r,i)=>{ mx.fillStyle = i===roomAt(me.x) ? "rgba(243,194,107,.18)" : "rgba(255,255,255,.05)"; mx.fillRect(r.x*s+1,2,r.w*s-2,h-4); });
  frames.forEach(f=>{ mx.fillStyle="rgba(243,194,107,.7)"; mx.fillRect(f.x*s-2,2,4,3); });
  others.forEach(o=>{ mx.fillStyle=o.color||"#fff"; mx.beginPath(); mx.arc(o.x*s,o.y*s*(h/(WORLD_H*s)),2.2,0,7); mx.fill(); });
  mx.fillStyle=color; mx.beginPath(); mx.arc(me.x*s,me.y*s*(h/(WORLD_H*s)),3.2,0,7); mx.fill();
  mx.strokeStyle="#fff"; mx.lineWidth=1; mx.stroke();
}

});

function planTo(tx,ty){
  tx=Math.max(R,Math.min(WORLD_W-R,tx)); ty=Math.max(WALL+R,Math.min(H-R,ty));
  const pts=[]; let ri=roomAt(me.x); const ti=roomAt(tx);
  while(ri!==ti){
    const bx = ti>ri ? rooms[ri+1].x : rooms[ri].x;
    pts.push({x: bx + (ti>ri?-30:30), y:DOORY}, {x: bx + (ti>ri?30:-30), y:DOORY});
    ri += ti>ri?1:-1;
  }
  pts.push({x:tx,y:ty}); path=pts;
}
cv.addEventListener("pointerdown",e=>{
  if(!ticket || !$("gate").classList.contains("hidden")) return;
  const p=toWorld(e.clientX,e.clientY);
  const hit=frames.find(f=>Math.abs(p.x-f.x)<f.w/2+12 && (f.panel ? (p.y>f.y-f.h/2-40 && p.y<f.y+f.h/2+34) : (p.y>f.y-f.h/2-12 && p.y<WALL+50)));
  if(hit){ if(Math.hypot(me.x-hit.vx,me.y-hit.vy)<70){ openFrame(hit); return; } pendingOpen=hit; planTo(hit.vx,hit.vy); }
  else { pendingOpen=null; planTo(p.x,p.y); }
});
mm.addEventListener("pointerdown",e=>{
  const r=mm.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*WORLD_W;
  pendingOpen=null; planTo(x, DOORY);
});

let lastSent=0, lastSentPos="";
function step(dt){
  const sp=230*dt; let dx=0,dy=0;
  if(keys.arrowleft||keys.a) dx-=1; if(keys.arrowright||keys.d) dx+=1;
  if(keys.arrowup||keys.w) dy-=1; if(keys.arrowdown||keys.s) dy+=1;
  if(!dx && !dy && path.length){
    const p=path[0], ddx=p.x-me.x, ddy=p.y-me.y, d=Math.hypot(ddx,ddy);
    if(d<6){ path.shift(); if(!path.length && pendingOpen){ const f=pendingOpen; pendingOpen=null; openFrame(f); } }
    else { dx=ddx/d; dy=ddy/d; }
  } else if(dx&&dy){ dx*=.7071; dy*=.7071; }
  me.moving = !!(dx||dy) && $("modal").classList.contains("hidden");
  if(me.moving){
    const nx=me.x+dx*sp, ny=me.y+dy*sp;
    if(valid(nx,me.y)) me.x=nx; else if(path.length && !valid(nx,me.y)) {}
    if(valid(me.x,ny)) me.y=ny;
    if(dx) me.dir = dx>0?1:-1;
    if(path.length && !valid(nx,me.y) && !valid(me.x,ny)) path=[];
  }
  updateGuide(dt);
  // nearest frame
  let best=null, bd=75;
  frames.forEach(f=>{ const d=Math.hypot(me.x-f.vx,me.y-f.vy); if(d<bd){bd=d;best=f;} });
  if(best!==near){ near=best; const pr=$("prompt");
    if(near && !modalFrame){ pr.textContent = (near.type==="guestbook"?"방명록 열기":near.type==="letter"?"마지막 인사 읽기":near.type==="story"?"「"+near.title+"」 읽기":"「"+near.title+"」 감상하기") + (matchMedia("(pointer:coarse)").matches?" · 탭":" · Space"); pr.classList.remove("hidden"); pr.classList.toggle("up", !!near.panel); pr.onclick=()=>openFrame(near); }
    else pr.classList.add("hidden"); }
  $("roomName").textContent = rooms[roomAt(me.x)].name;
  // send presence
  const now=performance.now(), pos=Math.round(me.x)+","+Math.round(me.y)+","+me.dir+","+(me.moving?1:0);
  if(room && now-lastSent>250 && pos!==lastSentPos){ lastSent=now; lastSentPos=pos; room.presence({x:Math.round(me.x),y:Math.round(me.y),dir:me.dir,m:me.moving?1:0}).catch(()=>{}); }
  // others interpolate
  others.forEach(o=>{ o.x+=(o.tx-o.x)*Math.min(1,dt*10); o.y+=(o.ty-o.y)*Math.min(1,dt*10); });
}

function updateGuide(dt){
  // 새 전시실에 들어서면 소개
  const ri=roomAt(me.x);
  if(ri!==guide.room){ guide.room=ri; const r=rooms[ri]; if(r.intro && !guide.seen[ri]){ guide.seen[ri]=1; guide.roomSay=r.intro.replace(/\n/g," "); guide.roomSayUntil=performance.now()+12000; guide.greetUntil=0; guide.greet2Until=0; } }
  // 관객 발자취 기록
  const last=trail[trail.length-1];
  if(!last || Math.hypot(last.x-me.x,last.y-me.y)>6){ trail.push({x:me.x,y:me.y}); if(trail.length>200) trail.shift(); }
  // 가장 가까운 영상 액자 (도슨트가 설명할 대상)
  let focus=null, fd=95;
  frames.forEach(f=>{ if(f.type && f.type!=="story") return; const d=Math.hypot(me.x-f.vx,me.y-f.vy); if(d<fd){fd=d;focus=f;} });
  if(focus && roomAt(guide.x)!==focus.room) focus=null;   // 같은 방에 도착한 뒤에 설명
  let tx, ty;
  if(focus){ tx= focus.panel ? focus.x+focus.w/2+46 : focus.x-74; ty= focus.panel ? H-64 : WALL+52; }
  else {
    // 관객 바로 뒤 발자취를 따라감
    let i=trail.length-1, acc=0;
    while(i>0 && acc<58){ acc+=Math.hypot(trail[i].x-trail[i-1].x, trail[i].y-trail[i-1].y); i--; }
    const p=trail[Math.max(0,i)]||{x:guide.x,y:guide.y}; tx=p.x; ty=p.y;
    // 이미 충분히 가까우면 멈춤 / 입장 인사 중에는 제자리
    if(Math.hypot(me.x-guide.x,me.y-guide.y)<62) { tx=guide.x; ty=guide.y; }
    if(performance.now()<guide.greetUntil && Math.hypot(me.x-140,me.y-DOORY)<60){ tx=guide.x; ty=guide.y; }
    else if(performance.now()<guide.greet2Until && Math.hypot(me.x-140,me.y-DOORY)<60){ tx=410; ty=DOORY+120; }
    // 너무 멀어지면(지도 이동 등) 관객 옆으로 순간 이동
    if(Math.hypot(me.x-guide.x,me.y-guide.y)>520 || roomAt(guide.x)!==roomAt(me.x) && Math.abs(guide.x-me.x)>420){ guide.x=me.x-50; guide.y=Math.min(H-R,me.y+20); trail.length=0; }
  }
  const dx=tx-guide.x, dy=ty-guide.y, d=Math.hypot(dx,dy), sp=260*dt;
  guide.moving = d>4;
  if(guide.moving){ const k=Math.min(1,sp/d); guide.x+=dx*k; guide.y+=dy*k; if(Math.abs(dx)>1) guide.dir=dx>0?1:-1; }
  guide.focus=focus;
  if(focus && d<12){ guide.say=hostLine(focus); guide.point = focus.x>guide.x?1:-1; }
  // 인사 후 관객이 오른쪽으로 가지 않고 음비맨에게 다가오면 짧게 다시 안내
  const now=performance.now();
  if(roomAt(me.x)===0 && guide.greetUntil && now>=guide.greet2Until && now>=guide.approachNext && Math.hypot(me.x-guide.x,me.y-guide.y)<72){ guide.approachUntil=now+7000; guide.approachNext=now+15000; }
  if(roomAt(me.x)!==0) guide.approachUntil=0;
  if(focus && d<12){}
  else if(now<guide.approachUntil){ guide.say=C.hostApproach||""; guide.point=1; }
  else if(performance.now()<guide.greetUntil){ guide.say=C.hostGreeting||""; guide.point=1; }
  else if(performance.now()<guide.greet2Until){ guide.say=C.hostGreeting2||""; guide.point=1; }
  else if(performance.now()<guide.roomSayUntil){ guide.say=guide.roomSay; guide.point=1; }
  else guide.say="";
}

function syncPeers(peers){
  const seen=new Set();
  peers.forEach(p=>{
    if(p.isMe || p.kind!=="viewer") return;
    const pr=p.presence||{}; if(typeof pr.x!=="number"||typeof pr.y!=="number") return;
    seen.add(p.peer);
    let o=others.get(p.peer);
    const x=Math.max(0,Math.min(WORLD_W,pr.x)), y=Math.max(WALL,Math.min(H,pr.y));
    if(!o){ o={x,y,tx:x,ty:y,emote:null}; others.set(p.peer,o); }
    o.tx=x; o.ty=y; o.dir=pr.dir===-1?-1:1; o.moving=!!pr.m;
    o.nick=typeof pr.nick==="string"?pr.nick.slice(0,12):"관객";
    o.color=typeof pr.c==="string" && /^#[0-9a-f]{6}$/i.test(pr.c)?pr.c:"#f1e9df";
    o.w=typeof pr.w==="string"?pr.w.slice(0,20):"";
  });
  [...others.keys()].forEach(k=>{ if(!seen.has(k)) others.delete(k); });
  $("liveCount").textContent="지금 "+(others.size+1)+"명 관람 중";
  if(modalFrame) updateWatching();
}
const SB_OK = !!(window.supabase && C.supabaseUrl && C.supabaseAnonKey && !/YOUR_/.test(C.supabaseUrl+C.supabaseAnonKey));
const sb = SB_OK ? window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey) : null;
let myPeer = store.get("ut12_peer");
if(!myPeer){ myPeer = "p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); store.set("ut12_peer", myPeer); }
myPeer += "-"+Math.random().toString(36).slice(2,6); // 탭마다 구분
let chan=null, liveOk=false; const myPres={}; const peerState=new Map();
function pushPeers(){
  syncPeers([...peerState].map(([k,v])=>({ peer:k, isMe:k===myPeer, kind:"viewer", presence:v })));
}
// Supabase 무료 한도: presence 갱신은 클라이언트당 30초에 5회까지 → 6.5초에 한 번으로 묶어서 보냄
let lastTrack=0, trackTimer=null;
function scheduleTrack(){
  if(trackTimer) return;
  const wait=Math.max(0, 6500-(Date.now()-lastTrack));
  trackTimer=setTimeout(()=>{ trackTimer=null; lastTrack=Date.now(); if(chan&&liveOk) chan.track({ ...myPres }); }, wait);
}
const liveShim = {
  presence(patch){
    Object.assign(myPres, patch);
    if(!chan || !liveOk) return Promise.resolve();
    const moveOnly = Object.keys(patch).every(k=>["x","y","dir","m"].includes(k));
    if(moveOnly && patch.m) chan.send({ type:"broadcast", event:"move", payload:{ p:myPeer, x:patch.x, y:patch.y, dir:patch.dir, m:1 } });
    else scheduleTrack();
    return Promise.resolve();
  },
  emit(topic, data){
    if(chan && liveOk) chan.send({ type:"broadcast", event:topic, payload:{ ...data, p:myPeer } });
    return Promise.resolve();
  },
  connected(){ return liveOk; }
};
function startLive(){
  if(!sb) return;
  Object.assign(myPres, { nick:ticket.nick, c:color, x:Math.round(me.x), y:Math.round(me.y), dir:me.dir, m:0, w:"" });
  chan = sb.channel("ut12-gallery", { config:{ presence:{ key:myPeer }, broadcast:{ self:false } } });
  chan.on("presence", { event:"sync" }, ()=>{
    const st = chan.presenceState(); const keys = new Set();
    for(const k in st){
      const metas = st[k]; if(!metas || !metas.length) continue;
      const p = { ...metas[metas.length-1] }; delete p.presence_ref; keys.add(k);
      const prev = peerState.get(k);
      if(prev && prev._mt && Date.now()-prev._mt < 1500){ p.x=prev.x; p.y=prev.y; p.m=prev.m; p._mt=prev._mt; }
      peerState.set(k, p);
    }
    [...peerState.keys()].forEach(k=>{ if(!keys.has(k)) peerState.delete(k); });
    pushPeers();
  });
  chan.on("broadcast", { event:"move" }, ({ payload })=>{
    const k = payload && payload.p; const o = k && peerState.get(k);
    if(!o || typeof payload.x!=="number" || typeof payload.y!=="number") return;
    o.x=payload.x; o.y=payload.y; o.dir=payload.dir===-1?-1:1; o.m=1; o._mt=Date.now();
    pushPeers();
  });
  chan.on("broadcast", { event:"emote" }, ({ payload })=>{
    const e = payload && typeof payload.e==="string" && ["👏","💛","🎶","🥲"].includes(payload.e) ? payload.e : null;
    const o = e && others.get(payload.p); if(o) o.emote={ e, t:performance.now() };
  });
  chan.subscribe(status=>{
    if(status==="SUBSCRIBED"){ liveOk=true; room=liveShim; lastTrack=Date.now(); chan.track({ ...myPres }); }
    else if(status==="CHANNEL_ERROR" || status==="TIMED_OUT" || status==="CLOSED"){ liveOk=false; }
  });
}

function clean(v,id){
  const o={ id, nick:String(v.nick||"관객").slice(0,12), color: typeof v.color==="string"&&/^#[0-9a-f]{6}$/i.test(v.color)?v.color:"#f1e9df", notes:{}, gb:null, t:+v.t||0 };
  if(v.notes && typeof v.notes==="object") for(const k in v.notes){ const n=v.notes[k]; if(n&&typeof n.text==="string"&&n.text.trim()) o.notes[k.slice(0,20)]={text:n.text.slice(0,500),t:+n.t||0}; }
  if(v.gb && typeof v.gb.text==="string" && v.gb.text.trim()) o.gb={text:v.gb.text.slice(0,600),t:+v.gb.t||0};
  return o;
}
let rows=[];
function rebuild(){
  const by=new Map();
  rows.slice().sort((a,b)=>a.t-b.t).forEach(r=>{
    let v=by.get(r.user_id);
    if(!v){ v={ id:r.user_id, nick:"관객", color:"#f1e9df", notes:{}, gb:null, t:0 }; by.set(r.user_id,v); }
    v.nick=r.nick; v.color=r.color; v.t=Math.max(v.t,r.t);
    if(r.work_id==="guestbook") v.gb={ text:r.body, t:r.t }; else v.notes[r.work_id]={ text:r.body, t:r.t };
  });
  visitors=[...by.values()].map(v=>clean(v,v.id));
  myDoc=visitors.find(v=>v.id===uid)||null;
}
function normRow(r){
  return { id:r.id, user_id:r.user_id, work_id:String(r.work_id||"").slice(0,40), nick:String(r.nick||"관객").slice(0,12),
    color:String(r.color||"#f1e9df"), body:String(r.body||"").slice(0,600), t:Date.parse(r.updated_at||r.created_at)||0 };
}
function applyRow(r){ const i=rows.findIndex(x=>x.id===r.id); if(i>-1) rows[i]=r; else rows.push(r); }
async function startDb(){
  if(!sb){ dbState="off"; refreshModal(); return; }
  try{
    let { data:{ session } } = await sb.auth.getSession();
    let user = session && session.user;
    if(!user){ const r = await sb.auth.signInAnonymously(); if(r.error) throw r.error; user = r.data.user; }
    uid = user.id; canWrite = true;
    const { data, error } = await sb.from("comments").select("*").order("updated_at",{ ascending:false }).limit(3000);
    if(error) throw error;
    rows = (data||[]).map(normRow); rebuild(); dbState="ready"; refreshModal();
    sb.channel("ut12-comments").on("postgres_changes", { event:"*", schema:"public", table:"comments" }, p=>{
      if(p.eventType==="DELETE"){ const id=p.old&&p.old.id; rows=rows.filter(x=>x.id!==id); }
      else if(p.new) applyRow(normRow(p.new));
      rebuild(); refreshModal();
    }).subscribe();
  }catch(e){ console.error(e); dbState="error"; canWrite=false; refreshModal(); }
}
let saving=false;
async function saveComment(workId, text){
  if(!sb||!uid||saving) return false;
  saving=true;
  try{
    if(text){
      const { data, error } = await sb.from("comments").upsert(
        { user_id:uid, work_id:workId, nick:ticket.nick, color, body:text, updated_at:new Date().toISOString() },
        { onConflict:"user_id,work_id" }).select().single();
      if(error) throw error; applyRow(normRow(data));
    } else {
      const { error } = await sb.from("comments").delete().eq("user_id",uid).eq("work_id",workId);
      if(error) throw error; rows=rows.filter(x=>!(x.user_id===uid && x.work_id===workId));
    }
    rebuild(); saving=false; return true;
  }catch(e){ console.error(e); saving=false; return false; }
}
function ownerRemove(){}
function ago(t){
  const s=(Date.now()-t)/1000;
  if(s<60) return "방금"; if(s<3600) return Math.floor(s/60)+"분 전"; if(s<86400) return Math.floor(s/3600)+"시간 전";
  const d=new Date(t); return d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate();
}
function writeNote(){
  if(dbState==="off") return "댓글 서버가 아직 연결되지 않았습니다.";
  if(dbState==="error"||!canWrite) return "댓글 서버에 연결하지 못했습니다.";
  return "";
}

/* =================== MODALS =================== */
function openFrame(f){
  if(!f) return;
  modalFrame=f; $("prompt").classList.add("hidden");
  path=[]; pendingOpen=null; for(const k in keys) keys[k]=false;
  if(room) room.presence({w:f.id}).catch(()=>{});
  renderModal(true);
  $("modal").classList.remove("hidden");
}
function closeModal(){
  const v=$("modal").querySelector("video"); if(v){ v.pause(); }
  if(bgmWasPlaying){ audio.play().catch(()=>{}); bgmWasPlaying=false; }
  $("modal").classList.add("hidden"); $("modal").innerHTML=""; modalFrame=null; near=null;
  if(room) room.presence({w:""}).catch(()=>{});
}
$("modal").addEventListener("pointerdown",e=>{ if(e.target.id==="modal") closeModal(); });
function refreshModal(){ if(modalFrame) renderModal(false); }
function watchingCount(id){ let n=0; others.forEach(o=>{ if(o.w===id) n++; }); return n; }
function updateWatching(){ const w=$("watching"); if(!w||!modalFrame) return; const n=watchingCount(modalFrame.id); w.textContent = n ? "지금 "+n+"명이 함께 보고 있어요" : ""; }

function renderModal(first){
  const f=modalFrame, M=$("modal");
  // keep video & draft while refreshing
  const draftEl=M.querySelector("textarea"); const draft = draftEl ? {v:draftEl.value, touched:draftEl.dataset.touched} : null;
  if(f.type==="letter"){ if(!first) return; M.innerHTML=""; M.append(letterPanel()); return; }
  if(f.type==="guestbook"){ const sc=M.querySelector(".gb"); const top=sc?sc.scrollTop:0; M.innerHTML=""; M.append(guestbookPanel(draft)); const n=M.querySelector(".gb"); if(n) n.scrollTop=top; return; }
  if(first){
    M.innerHTML="";
    const p=el("div","panel");
    const x=el("button","close","✕"); x.onclick=closeModal; p.append(x);
    const sc=el("div","screen");
    if(f.type==="story"){
      p.classList.add("story");
      (f.images||[]).forEach((src,i)=>{ const box=el("div","st-img"+(i===0?" on":"")); box.dataset.i=i;
        if(src){ const im=document.createElement("img"); im.src=src; im.alt=""; box.append(im); } else box.append(el("div","noscreen","이미지 "+(i+1)+" 준비 중"));
        sc.append(box); });
      const dots=el("div","st-dots"); (f.images||[]).forEach((_,i)=>dots.append(el("span",i===0?"on":"")));
      sc.append(dots);
    }
    else if(f.yt){
      if(!audio.paused){ bgmWasPlaying=true; audio.pause(); }
      if(C.embedYouTube){ const ifr=document.createElement("iframe"); ifr.src="https://www.youtube-nocookie.com/embed/"+f.yt+"?rel=0&playsinline=1&autoplay=1";
        ifr.allow="autoplay; encrypted-media; picture-in-picture; fullscreen"; ifr.allowFullscreen=true; ifr.title=f.title; ifr.referrerPolicy="strict-origin-when-cross-origin"; sc.append(ifr); }
      else { const n=el("div","noscreen"); const box=el("div"); box.append(el("div",null,"유튜브 영상 · 공개 버전에서 액자 안에서 재생됩니다"));
        const a=el("a",null,"유튜브에서 보기 ↗"); a.href="https://www.youtube.com/watch?v="+f.yt; a.target="_blank"; a.rel="noopener"; a.style.cssText="display:inline-block;margin-top:12px;color:#f3c26b";
        box.append(a); n.append(box); sc.append(n); }
    }
    else if(f.video){ const v=document.createElement("video"); v.src=f.video; v.controls=true; v.playsInline=true; v.preload="auto"; v.autoplay=true; if(f.image) v.poster=f.image;
      v.onplay=()=>{ if(!audio.paused){ bgmWasPlaying=true; audio.pause(); } }; sc.append(v); }
    else if(f.image){ const im=document.createElement("img"); im.src=f.image; im.alt=f.title; sc.append(im); }
    else { const n=el("div","noscreen"); n.append(document.createTextNode("영상 준비 중")); sc.append(n); }
    p.append(sc);
    const side=el("div","side"); side.id="side"; p.append(side);
    M.append(p);
  }
  const side=$("side"); if(!side) return;
  const keepTop=side.scrollTop, keepPanel=(M.querySelector(".panel")||{}).scrollTop||0;
  side.innerHTML="";
  side.append(el("div","eyebrow",(rooms[f.room].name)+(f.year?"  ·  "+f.year:"")));
  side.append(el("h2",null,f.title));
  if(f.note){ const h=el("div","host"); const hw=el("div","host-who"); const pi=document.createElement("img"); pi.src=UMBI_SRC; pi.alt=""; pi.className="host-pic"; hw.append(pi, document.createTextNode((C.host||"음비맨")+"의 한마디")); h.append(hw, el("div","host-tx",f.note)); side.append(h); }
  if(f.desc) side.append(el("div","desc",f.desc)); else if(f.type!=="story") side.append(el("div","desc ph","작품 설명을 채워 주세요."));
  const w=el("div","watching"); w.id="watching"; side.append(w);
  if(f.type==="story"){
    const st=el("div","st-text");
    if(!f.text) st.append(el("p","desc ph","글을 채워 주세요."));
    let img=0;
    String(f.text||"").split(/\n\s*\n/).forEach(par=>{
      const t=par.trim(); if(!t) return;
      const m=t.match(/^\[이미지\s*(\d+)\]$/);
      if(m){ img=Math.max(0,Math.min((f.images||[]).length-1, +m[1]-1)); const mk=el("div","st-mark"); mk.dataset.i=img; const src=(f.images||[])[img]; if(src){ const ii=document.createElement("img"); ii.className="st-inline"; ii.src=src; ii.alt=""; ii.loading="lazy"; mk.append(ii); } st.append(mk); return; }
      const pe = t.startsWith("## ") ? el("h3","st-h",t.slice(3)) : el("p","st-p",t); pe.dataset.i=img; st.append(pe);
    });
    if(f.link){ const a=el("a","st-link","브런치에서 원문 보기 ↗"); a.href=f.link; a.target="_blank"; a.rel="noopener"; st.append(a); }
    side.append(st);
  }
  side.append(el("div","cm-head","COMMENTS"));
  const list=el("div","cms");
  const items=visitors.filter(v=>v.notes[f.id]).map(v=>({v,n:v.notes[f.id]})).sort((a,b)=>b.n.t-a.n.t);
  if(dbState==="loading") list.append(el("div","cm-empty","댓글을 불러오는 중"));
  else if(dbState==="slow") list.append(el("div","cm-empty","댓글에 아직 연결되지 않았습니다."));
  else if(dbState==="error") list.append(el("div","cm-empty","댓글을 불러오지 못했습니다."));
  else if(dbState==="off") list.append(el("div","cm-empty","댓글 서버가 아직 연결되지 않았습니다."));
  else if(!items.length) list.append(el("div","cm-empty","이 영상의 첫 댓글을 남겨 주세요."));
  items.forEach(({v,n})=>{
    const c=el("div","cm"+(v.id===uid?" mine":""));
    const who=el("div","who"); const dot=el("span","dot"); dot.style.background=v.color; who.append(dot, el("span",null,v.nick), el("span",null,ago(n.t)));
    if(isOwner && v.id!==uid){ const d=el("button","del","내리기"); let armed=false;
      d.onclick=()=>{ if(!armed){ armed=true; d.textContent="한 번 더"; setTimeout(()=>{armed=false;d.textContent="내리기";},3000); return; } ownerRemove(v.id,f.id); }; who.append(d); }
    c.append(who, el("div","tx",n.text)); list.append(c);
  });
  side.append(list);
  side.append(commentForm(f.id, myDoc && myDoc.notes[f.id] ? myDoc.notes[f.id].text : "", draft, 500, f.type==="story"?"이 글을 읽고 떠오른 이야기":"이 영상을 보고 떠오른 이야기", t=>saveComment(f.id,t)));
  updateWatching();
  side.scrollTop=keepTop; const pnl=M.querySelector(".panel"); if(pnl) pnl.scrollTop=keepPanel;
  if(f.type==="story"){ const upd=()=>storyScroll(M); side.onscroll=upd; if(pnl) pnl.onscroll=upd; requestAnimationFrame(()=>requestAnimationFrame(upd)); }
}
function storyScroll(M){
  const ps=[...M.querySelectorAll(".st-p,.st-h,.st-mark")]; if(!ps.length) return;
  const mid=innerHeight*0.55; let cur=0;
  ps.forEach(e=>{ if(e.getBoundingClientRect().top<mid) cur=+e.dataset.i||0; });
  const sc=[M.querySelector("#side"),M.querySelector(".panel")].find(x=>x && x.scrollHeight>x.clientHeight+4);
  if(sc && sc.scrollTop+sc.clientHeight>=sc.scrollHeight-6){ cur=Math.max(...ps.map(e=>+e.dataset.i||0)); }
  M.querySelectorAll(".st-img").forEach(b=>b.classList.toggle("on", +b.dataset.i===cur));
  M.querySelectorAll(".st-dots span").forEach((d,i)=>d.classList.toggle("on", i===cur));
}

function commentForm(key, existing, draft, max, ph, onSave){
  const form=el("form","cm-form");
  const ta=document.createElement("textarea"); ta.maxLength=max; ta.placeholder=ph;
  ta.value = draft && draft.touched ? draft.v : existing; if(draft && draft.touched) ta.dataset.touched="1";
  ta.addEventListener("input",()=>ta.dataset.touched="1");
  ta.addEventListener("keydown",e=>e.stopPropagation());
  const row=el("div","row"); const note=el("span","note", writeNote() || (existing? "한 사람당 하나, 고쳐 쓸 수 있어요" : ticket.nick+" 이름으로 남겨요"));
  const b=el("button","btn", existing?"고쳐 쓰기":"남기기"); b.type="submit";
  if(writeNote()){ ta.disabled=true; b.disabled=true; }
  row.append(note,b); form.append(ta,row);
  form.addEventListener("submit", async e=>{
    e.preventDefault(); const t=ta.value.trim().slice(0,max);
    if(!t && !existing) return;
    b.disabled=true; b.textContent="저장 중…";
    const ok=await onSave(t);
    if(ok){ delete ta.dataset.touched; me.emote={e:"💛",t:performance.now()}; refreshModal(); }
    else { b.disabled=false; b.textContent=existing?"고쳐 쓰기":"남기기"; note.textContent = writeNote() || "저장하지 못했습니다. 잠시 후 다시 시도해 주세요."; }
  });
  return form;
}

function guestbookPanel(draft){
  const p=el("div","panel single");
  const x=el("button","close","✕"); x.onclick=closeModal; p.append(x);
  const g=el("div","gb");
  g.append(el("div","eyebrow","Guestbook"), el("h2",null,"방명록"), el("div","sub","유니크튠즈에게 남기고 싶은 말을 적어 주세요. 한 분당 한 장씩, 언제든 고쳐 쓸 수 있어요."));
  g.append(commentForm("guestbook", myDoc&&myDoc.gb?myDoc.gb.text:"", draft, 600, "유니크튠즈에게", t=>saveComment("guestbook",t)));
  const cards=el("div","cards");
  const items=visitors.filter(v=>v.gb).sort((a,b)=>b.gb.t-a.gb.t);
  if(dbState==="ready" && !items.length) cards.append(el("div","cm-empty","아직 남겨진 글이 없습니다."));
  else if(dbState!=="ready") cards.append(el("div","cm-empty", dbState==="off"?"방명록 서버가 아직 연결되지 않았습니다.":dbState==="loading"?"불러오는 중":"방명록에 연결하지 못했습니다."));
  items.forEach(v=>{
    const c=el("div","card"+(v.id===uid?" mine":""));
    c.append(el("div","msg",v.gb.text));
    const m=el("div","meta"); m.append(el("b",null,v.nick), el("span",null,ago(v.gb.t))); c.append(m);
    if(isOwner && v.id!==uid){ const d=el("button","del","내리기"); let armed=false;
      d.onclick=()=>{ if(!armed){ armed=true; d.textContent="한 번 더"; setTimeout(()=>{armed=false;d.textContent="내리기";},3000); return; } ownerRemove(v.id,"guestbook"); }; c.append(d); }
    cards.append(c);
  });
  g.append(cards); p.append(g); return p;
}

function letterPanel(){
  const p=el("div","panel single");
  const x=el("button","close","✕"); x.onclick=closeModal; p.append(x);
  const l=el("div","letter");
  l.append(el("div","eyebrow","Curtain Call"), el("h2",null,"고맙습니다"), el("div","body",C.letter), el("div","sign",C.signature));
  const cr=el("div","credits"); C.credits.forEach(([k,v])=>{ const d=el("div"); d.append(el("b",null,k+"   "), document.createTextNode(v)); cr.append(d); });
  l.append(cr); p.append(l); return p;
}

setInterval(()=>{ if(modalFrame && modalFrame.type!=="letter") refreshModal(); }, 60000);
})();
